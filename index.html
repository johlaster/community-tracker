    .topbar{position:sticky;top:0;z-index:10;background:rgba(245,247,251,.93);backdrop-filter:blur(14px);border-bottom:1px solid rgba(229,231,235,.8)}.topbar-inner{max-width:1120px;margin:auto;min-height:68px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--primary);color:white;font-size:20px;box-shadow:var(--shadow)}.brand h1{font-size:18px;margin:0}.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}

    .nav{position:fixed;z-index:20;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 16px 36px rgba(15,23,42,.16);border-radius:18px;padding:6px}.nav button{width:92px;border:0;background:transparent;padding:9px 8px;border-radius:13px;color:var(--muted);font-size:12px;font-weight:700}.nav button span{display:block;font-size:19px;margin-bottom:2px}.nav button.active{background:var(--primary);color:white}
    .modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.46);display:grid;place-items:end center;padding:16px}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:white;border-radius:22px;box-shadow:0 24px 70px rgba(15,23,42,.25);padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h3{margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.empty{color:var(--muted);text-align:center;padding:32px 10px}.check{width:27px;height:27px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;background:white;color:white;flex:0 0 auto}.check.checked{background:var(--success);border-color:var(--success)}.rsvp{display:flex;gap:5px}.rsvp button{border:1px solid var(--line);background:white;padding:7px 9px;border-radius:9px;font-size:12px;font-weight:700}.rsvp button.active.yes{background:var(--success-soft);color:var(--success)}.rsvp button.active.no{background:var(--danger-soft);color:var(--danger)}
    .hero{padding:22px;background:linear-gradient(135deg,#111827,#334155);color:white;border:0}.hero .meta{color:rgba(255,255,255,.72)}.hero-number{font-size:44px;font-weight:800;letter-spacing:-.05em;margin:10px 0 2px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 15%,#dbeafe 0,transparent 32%),radial-gradient(circle at 85% 85%,#ede9fe 0,transparent 30%),var(--bg)}.login-card{width:min(470px,100%);padding:28px}.login-card h1{margin:0 0 8px}.login-card>.logo{width:48px;height:48px;font-size:24px}.notice{padding:12px 14px;border-radius:12px;background:var(--blue-soft);color:#1e40af;font-size:13px;line-height:1.5;margin:14px 0}.error{background:var(--danger-soft);color:var(--danger)}.success{background:var(--success-soft);color:var(--success)}.small{font-size:12px;color:var(--muted);line-height:1.5}.loading{position:fixed;inset:0;z-index:100;background:rgba(245,247,251,.75);backdrop-filter:blur(3px);display:grid;place-items:center;font-weight:800}.btn{transition:transform .16s ease,box-shadow .16s ease,background .16s ease}.btn:hover{transform:translateY(-1px);box-shadow:0 7px 16px rgba(15,23,42,.12)}.card{transition:box-shadow .18s ease}.card:hover{box-shadow:0 16px 38px rgba(15,23,42,.1)}
    .viewer-mode button[onclick^="openEvent("],.viewer-mode button[onclick^="openPerson("],.viewer-mode button[onclick^="openEditPerson("],.viewer-mode button[onclick^="openEditEvent("],.viewer-mode button[onclick^="openCopyEvent("],.viewer-mode button[onclick^="openExistingPerson("],.viewer-mode button[onclick^="openGuest("],.viewer-mode button[onclick^="toggleCustomer("],.viewer-mode button[onclick^="deletePerson("],.viewer-mode button[onclick^="deleteEvent("],.viewer-mode .remove-person{display:none!important}.viewer-mode .rsvp button,.viewer-mode .check{pointer-events:none;cursor:default}.role-label{display:inline-block;margin-left:5px;font-weight:700}.member-email{overflow-wrap:anywhere}
    @media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}}@media(max-width:560px){.topbar{position:static}.container{padding:18px 12px 92px}.topbar-inner{padding:10px 12px}.stats{gap:10px}.card{padding:15px;border-radius:16px}.stat-value{font-size:24px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.nav{bottom:8px;width:calc(100% - 16px);justify-content:space-around}.nav button{width:auto;flex:1;padding:8px 4px}.row{align-items:flex-start}.trend-row{grid-template-columns:minmax(80px,1fr) minmax(60px,1.5fr) 24px;gap:7px}}

<script>
const DEFAULT_CONFIG={url:'https://bzzruvkmwaekxxzrmywv.supabase.co',key:'sb_publishable_TCOoaED0wEn82aCGweE1-Q_ICzKG-Ks'};
let sb=null, session=null, route='dashboard', modal=null, selectedEventId=null, eventTemplateId=null, selectedPersonId=null, search='', eventFilter='Alle', customerFilter='Alle';
let recoveryMode=location.hash.includes('type=recovery');
let people=[], events=[], participations=[], workspaceMembers=[];
let accessRole=null, absenceDays=60, restoreData=null, restoreError='';
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const isAdmin=()=>accessRole==='admin';
const customerStatus=p=>p?.customer_status||(p?.customer?'before_event':'none');
const customerStatusLabel=s=>s==='before_event'?'Bereits Kunde':s==='through_event'?'Durch Event gewonnen':'Kein Kunde';
const isCustomer=p=>customerStatus(p)!=='none';
function readCustomerStatus(){const select=$('#pCustomerStatus')||$('#gCustomerStatus');return select?.value||($('#pCustomer')?.checked?'before_event':'none')}
const fmt=d=>new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d+'T12:00:00'));
const localToday=()=>{const now=new Date();return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`}
function setLoading(v){$('#loading')?.classList.toggle('hidden',!v)}
function notice(msg,type='notice'){return `<div class="notice ${type}">${esc(msg)}</div>`}
async function init(){const c=DEFAULT_CONFIG; try{sb=supabase.createClient(c.url,c.key); const {data}=await sb.auth.getSession(); session=data.session; sb.auth.onAuthStateChange((event,s)=>{session=s;if(event==='PASSWORD_RECOVERY')recoveryMode=true;if(recoveryMode){renderPasswordRecovery();return}if(session)startSession();else renderLogin()}); if(recoveryMode)renderPasswordRecovery();else if(session)await startSession();else renderLogin()}catch(e){document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="card login-card"><h1>Verbindung fehlgeschlagen</h1>${notice(e.message,'error')}<button class="btn" onclick="location.reload()">Erneut versuchen</button></div></div>`}}
function renderLogin(msg=''){document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="card login-card"><div class="logo">🎮</div><h1 style="margin-top:16px">Community Tracker</h1><p class="meta">Mit demselben Konto am Hauptrechner und Laptop anmelden.</p>${msg?notice(msg):''}<div class="field"><label>E-Mail</label><input id="email" class="input" type="email"></div><div class="field" style="margin-top:12px"><label>Passwort</label><input id="password" class="input" type="password"></div><button class="btn" style="width:100%;margin-top:16px" onclick="login()">Anmelden</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="signup()">Konto anlegen</button><button class="btn ghost" style="width:100%;margin-top:6px" onclick="requestPasswordReset()">Passwort vergessen?</button><div id="loginMsg"></div></div></div>`}
async function login(){setLoading(true);const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});setLoading(false);if(error)$('#loginMsg').innerHTML=notice(error.message,'error')}
async function signup(){setLoading(true);const {error}=await sb.auth.signUp({email:$('#email').value.trim(),password:$('#password').value});setLoading(false);$('#loginMsg').innerHTML=error?notice(error.message,'error'):notice('Konto angelegt. Prüfe gegebenenfalls deine E-Mails und bestätige die Anmeldung.','success')}
async function requestPasswordReset(){const email=$('#email').value.trim();if(!email){$('#loginMsg').innerHTML=notice('Bitte zuerst deine E-Mail-Adresse eingeben.','error');return}const redirectTo=location.hostname.endsWith('github.io')?'https://johlaster.github.io/community-tracker/':location.origin+location.pathname;setLoading(true);const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});setLoading(false);$('#loginMsg').innerHTML=error?notice(error.message,'error'):notice('Falls für diese Adresse ein Konto besteht, bekommst du einen Link zum Zurücksetzen. Öffne den Link bitte im selben Browser.', 'success')}
function renderPasswordRecovery(){document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="card login-card"><div class="logo">🎮</div><h1 style="margin-top:16px">Neues Passwort setzen</h1><p class="meta">Wähle ein neues Passwort für deinen Community Tracker.</p><div class="field" style="margin-top:16px"><label>Neues Passwort</label><input id="newPassword" class="input" type="password" autocomplete="new-password"></div><div class="field" style="margin-top:12px"><label>Passwort wiederholen</label><input id="confirmPassword" class="input" type="password" autocomplete="new-password"></div><button class="btn" style="width:100%;margin-top:16px" onclick="saveNewPassword()">Passwort speichern</button><div id="recoveryMsg"></div></div></div>`}
async function saveNewPassword(){const password=$('#newPassword').value,confirm=$('#confirmPassword').value;if(password.length<8){$('#recoveryMsg').innerHTML=notice('Das Passwort muss mindestens 8 Zeichen haben.','error');return}if(password!==confirm){$('#recoveryMsg').innerHTML=notice('Die Passwörter stimmen nicht überein.','error');return}setLoading(true);const {error}=await sb.auth.updateUser({password});setLoading(false);if(error){$('#recoveryMsg').innerHTML=notice(error.message,'error');return}recoveryMode=false;history.replaceState(null,'',location.pathname);await startSession()}
async function logout(){await sb.auth.signOut()}
async function startSession(){setLoading(true);const {data,error}=await sb.rpc('get_workspace_access');if(error||!data){setLoading(false);accessRole=null;renderNoAccess();return}accessRole=data.role;workspaceMembers=[];if(isAdmin()){const members=await sb.rpc('get_workspace_members');if(members.error){setLoading(false);document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="card login-card"><h1>Zugriff konnte nicht geladen werden</h1>${notice(members.error.message,'error')}<button class="btn secondary" onclick="logout()">Abmelden</button></div></div>`;return}workspaceMembers=members.data||[]}setLoading(false);await loadAll()}
function renderNoAccess(){document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="card login-card"><h1>Noch kein Bereich</h1><p class="meta">Dein Konto ist noch keinem Bereich zugeordnet. Du kannst einen eigenen getrennten Community Tracker starten oder dich von einem Admin freigeben lassen.</p><button class="btn" style="width:100%;margin-top:16px" onclick="createWorkspace()">Eigenen Bereich anlegen</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="logout()">Abmelden</button></div></div>`}
async function createWorkspace(){setLoading(true);const {error}=await sb.rpc('create_workspace_for_current_user');setLoading(false);if(error)return alert(error.message||'Der eigene Bereich konnte nicht angelegt werden.');await startSession()}
async function loadAll(){setLoading(true);const [p,e,a]=await Promise.all([sb.from('persons').select('*').order('name'),sb.from('events').select('*').order('event_date',{ascending:false}),sb.from('participations').select('*')]);setLoading(false);const err=p.error||e.error||a.error;if(err){document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="card login-card"><h1>Daten konnten nicht geladen werden</h1>${notice(err.message,'error')}<p class="small">Meist fehlen noch API-Berechtigungen oder die Sicherheitseinstellungen.</p><button class="btn secondary" onclick="logout()">Abmelden</button></div></div>`;return}people=p.data||[];events=e.data||[];participations=a.data||[];render()}
function visits(id){return participations.filter(a=>a.person_id===id&&a.attended&&events.some(e=>e.id===a.event_id&&e.status!=='Abgesagt')).length}function status(id){const v=visits(id);return v===0?['Noch kein Besuch','new','○']:v===1?['Erstbesuch','first','🟢']:v===2?['Neu','new','🔵']:['Stammgast','regular','⭐']}function evParts(id){return participations.filter(a=>a.event_id===id)}function evStats(id){const r=evParts(id);return{yes:r.filter(x=>x.response==='yes').length,attended:r.filter(x=>x.attended).length,noShows:r.filter(x=>x.response==='yes'&&!x.attended).length,total:r.length}}function getPerson(id){return people.find(p=>p.id===id)}
function referrerOptions(excludeId='',selectedId=''){return `<option value="">Keine Angabe</option>${people.filter(p=>p.id!==excludeId).map(p=>`<option value="${esc(p.id)}" ${p.id===selectedId?'selected':''}>${esc(p.name)}</option>`).join('')}`}
function noShowsForEvent(e){const s=evStats(e.id);return e.status==='Abgesagt'?0:(e.event_date<localToday()||e.status==='Abgeschlossen')?s.noShows:0}
function csvCell(value){let text=String(value??'');if(typeof value==='string'&&/^\s*[=+@-]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"'}
function downloadCsv(filename,rows){const content='\uFEFF'+rows.map(row=>row.map(csvCell).join(';')).join('\r\n')+'\r\n',url=URL.createObjectURL(new Blob([content],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadJson(filename,value){const content=JSON.stringify(value,null,2),url=URL.createObjectURL(new Blob([content],{type:'application/json;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportBackup(){downloadJson('community-tracker-sicherung-'+localToday()+'.json',{format:'community-tracker-backup',version:1,exported_at:new Date().toISOString(),persons:people,events,participations})}
function exportEvents(){const shown=eventFilter==='Alle'?events:events.filter(e=>(e.status||'Geplant')===eventFilter);const rows=[['Datum','Event','Status','Ort','Zusagen','Teilnehmer','No-Shows'],...shown.map(e=>{const s=evStats(e.id);return[fmt(e.event_date),e.title,e.status||'Geplant',e.location||'',s.yes,s.attended,noShowsForEvent(e)]})];downloadCsv('community-events-'+localToday()+'.csv',rows)}
function exportEvent(id){const e=events.find(e=>e.id===id);if(!e)return;const rows=[['Event','Datum','Status','Person','Antwort','Teilgenommen','Kunde','Kundenstatus','Mitgebracht von'],...evParts(id).map(a=>({a,p:getPerson(a.person_id)})).filter(x=>x.p).sort((x,y)=>x.p.name.localeCompare(y.p.name)).map(({a,p})=>[e.title,fmt(e.event_date),e.status||'Geplant',p.name,a.response==='yes'?'Zusage':a.response==='no'?'Absage':'Offen',a.attended?'Ja':'Nein',isCustomer(p)?'Ja':'Nein',customerStatusLabel(customerStatus(p)),getPerson(p.referred_by)?.name||getPerson(a.brought_by)?.name||''])];downloadCsv('community-event-'+e.event_date+'-'+e.id.slice(0,8)+'.csv',rows)}
function topbarAction(){if(route==='dashboard')return `<button class="btn secondary" onclick="exportBackup()">Sicherung</button>${isAdmin()?'<button class="btn secondary" onclick="openRestore()">Wiederherstellen</button><button class="btn secondary" onclick="openAccess()">Zugriff</button>':''}`;if(isAdmin()&&route==='person'&&getPerson(selectedPersonId))return `<button class="btn danger" onclick="deletePerson('${selectedPersonId}')">Person löschen</button>`;if(isAdmin()&&route==='event'&&events.some(e=>e.id===selectedEventId))return `<button class="btn danger" onclick="deleteEvent('${selectedEventId}')">Event löschen</button>`;return''}
function layout(content){return `<div class="${isAdmin()?'admin-mode':'viewer-mode'}"><header class="topbar"><div class="topbar-inner"><div class="brand"><div class="logo">🎮</div><div><h1>Community Tracker</h1><p>${esc(session?.user?.email||'')}<span class="role-label">· ${isAdmin()?'Admin':'Nur Lesen'}</span></p></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">${topbarAction()}${isAdmin()?'<button class="btn" onclick="openEvent()">+ Event</button>':''}<button class="btn secondary" onclick="logout()">Abmelden</button></div></div></header><main class="container">${content}</main><nav class="nav">${nav('dashboard','⌂','Dashboard')}${nav('events','◫','Events')}${nav('people','♙','Personen')}${isAdmin()?nav('admin','⚙','Verwaltung'):''}</nav>${renderModal()}</div>`}
function nav(r,i,l){return `<button class="${route===r?'active':''}" onclick="go('${r}')"><span>${i}</span>${l}</button>`}function go(r){route=r;selectedEventId=null;selectedPersonId=null;render()}
function render(){let c=route==='dashboard'?dashboard()+conversionOverview()+absenceCard():route==='events'?eventsPage():route==='people'?peoplePage():route==='admin'&&isAdmin()?adminPage():route==='person'?personDetail():eventDetail()+eventConversionDetail();document.getElementById('app').innerHTML=layout(c);enhanceCustomerForm()}
function eventConversion(eid){const event=events.find(e=>e.id===eid);if(!event)return{newPeople:0,newCustomers:0,rate:0};const peopleIds=[...new Set(evParts(eid).filter(a=>a.attended).map(a=>a.person_id))],newPeople=peopleIds.filter(pid=>{const first=personHistory(pid).filter(x=>x.a.attended&&x.e.status!=='Abgesagt').sort((a,b)=>a.e.event_date.localeCompare(b.e.event_date))[0];return first?.e.id===eid}),newCustomers=newPeople.filter(pid=>customerStatus(getPerson(pid))==='through_event').length;return{newPeople:newPeople.length,newCustomers,rate:newPeople.length?Math.round(newCustomers/newPeople.length*100):0}}
function conversionOverview(){const rows=events.filter(e=>e.event_date<=localToday()&&e.status!=='Abgesagt').sort((a,b)=>b.event_date.localeCompare(a.event_date)).map(e=>({...eventConversion(e.id),event:e})).filter(row=>row.newPeople);const totals=rows.reduce((sum,row)=>({newPeople:sum.newPeople+row.newPeople,newCustomers:sum.newCustomers+row.newCustomers}),{newPeople:0,newCustomers:0}),rate=totals.newPeople?Math.round(totals.newCustomers/totals.newPeople*100):0;return `<section class="card" style="margin-top:16px"><div class="page-head" style="margin-bottom:10px"><div><h3 class="section-title" style="margin-bottom:4px">🎯 Event-Conversion</h3><div class="meta">Neue Kontakte und daraus gewonnene Kunden.</div></div><span class="badge customer">${rate} % Conversion Rate</span></div><div class="grid stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div><div class="stat-label">Neue Personen</div><div class="stat-value">${totals.newPeople}</div></div><div><div class="stat-label">Kunden durch Events</div><div class="stat-value">${totals.newCustomers}</div></div><div><div class="stat-label">Ausgewertete Events</div><div class="stat-value">${rows.length}</div></div></div>${rows.length?`<div style="margin-top:12px">${rows.slice(0,5).map(row=>`<button class="trend-row" onclick="openEventDetail('${row.event.id}')"><span class="trend-name">${esc(row.event.title)} <span class="meta">${fmt(row.event.event_date)}</span></span><span class="meta">${row.newPeople} neue Personen · ${row.newCustomers} Kunden</span><strong>${row.rate}%</strong></button>`).join('')}</div>`:'<div class="empty">Sobald Personen bei einem Event als teilgenommen markiert sind, erscheint hier die Conversion.</div>'}</section>`}
function eventConversionDetail(){const e=events.find(x=>x.id===selectedEventId);if(!e)return'';const c=eventConversion(e.id);return `<section class="card" style="margin-top:16px"><h3 class="section-title">🎯 Was dieses Event gebracht hat</h3><div class="grid stats" style="grid-template-columns:repeat(3,minmax(0,1fr))">${stat('Neue Personen',c.newPeople,'Zum ersten Mal dabei')}${stat('Kunden gewonnen',c.newCustomers,'Status: Durch Event gewonnen')}${stat('Conversion Rate',c.rate+' %','Kunden / neue Personen')}</div><p class="meta">Eine Person zählt hier als neu, wenn dies ihr erstes als teilgenommen markiertes Event ist.</p></section>`}
function dashboard(){const now=new Date(),today=localToday(),past=events.filter(e=>e.event_date<today&&e.status!=='Abgesagt'),next=[...events].filter(e=>e.event_date>=today&&(!e.status||e.status==='Geplant')).sort((a,b)=>a.event_date.localeCompare(b.event_date))[0],last=[...past].sort((a,b)=>b.event_date.localeCompare(a.event_date))[0],lastStats=last?evStats(last.id):{yes:0,attended:0,noShows:0},regulars=people.filter(p=>visits(p.id)>=3).length,customers=people.filter(isCustomer).length,reliability=lastStats.yes?Math.round(lastStats.attended/lastStats.yes*100):0,average=past.length?(participations.filter(a=>a.attended&&past.some(e=>e.id===a.event_id)).length/past.length).toFixed(1).replace('.',','):'0',growthSince=new Date(now.getTime()-30*86400000),newPeople=people.filter(p=>p.created_at&&new Date(p.created_at)>=growthSince).length,topGuests=[...people].filter(p=>visits(p.id)>0).sort((a,b)=>visits(b.id)-visits(a.id)||a.name.localeCompare(b.name)).slice(0,5),trend=[...past].sort((a,b)=>b.event_date.localeCompare(a.event_date)).slice(0,6).reverse(),trendMax=Math.max(1,...trend.map(e=>evStats(e.id).attended)),refs=people.map(p=>({...p,count:people.filter(other=>other.referred_by===p.id).length})).filter(p=>p.count).sort((a,b)=>b.count-a.count);return `<div class="page-head"><div><div class="kicker">Überblick</div><h2>Deine Community</h2><p>Live-Daten aus Supabase.</p></div></div><div class="grid stats">${stat('Personen',people.length,`${newPeople} neu in den letzten 30 Tagen`)}${stat('Events',events.length,'Insgesamt erfasst')}${stat('Kunden',customers,`${regulars} Stammgäste`)}${stat('Ø Teilnehmer',average,'Pro Event')}</div><div class="grid two-col" style="margin-top:16px"><section class="card"><h3 class="section-title">📅 Nächstes Event</h3>${next?`<div class="person-name">${esc(next.title)}</div><div class="meta">${fmt(next.event_date)} · ${evStats(next.id).yes} Zusagen</div>`:'<div class="empty">Noch kein Event geplant.</div>'}</section><section class="card"><h3 class="section-title">🏁 Letztes Event</h3>${last?`<div class="person-name">${esc(last.title)}</div><div class="meta">${fmt(last.event_date)} · ${lastStats.attended} Teilnehmer</div>`:'<div class="empty">Noch kein vergangenes Event.</div>'}</section></div><div class="grid two-col" style="margin-top:16px"><section class="card hero"><div class="kicker" style="color:#ffffffaa">Zuverlässigkeit letztes Event</div><div class="hero-number">${reliability} %</div><div class="meta">${lastStats.attended} von ${lastStats.yes} Zusagen sind gekommen.</div></section><section class="card"><h3 class="section-title">🏆 Top-Zuträger</h3>${refs.length?refs.slice(0,5).map((p,i)=>`<div class="row"><div><div class="person-name">${i+1}. ${esc(p.name)}</div><div class="meta">${p.count} Personen mitgebracht</div></div><span class="badge">${p.count}</span></div>`).join(''):'<div class="empty">Noch keine Empfehlungen erfasst.</div>'}</section></div><section class="card" style="margin-top:16px"><h3 class="section-title">⭐ Häufigste Gäste</h3>${topGuests.length?topGuests.map((p,i)=>`<div class="row"><div><div class="person-name">${i+1}. ${esc(p.name)}</div><div class="meta">${visits(p.id)} Besuche</div></div><span class="badge regular">${customerStatusLabel(customerStatus(p))}</span></div>`).join(''):'<div class="empty">Noch keine Besuche erfasst.</div>'}</section><section class="card" style="margin-top:16px"><h3 class="section-title">📈 Teilnehmer der letzten Events</h3>${trend.length?trend.map(e=>{const count=evStats(e.id).attended;return `<button class="trend-row" onclick="openEventDetail('${e.id}')"><span class="trend-name">${esc(e.title)} <span class="meta">${fmt(e.event_date)}</span></span><span class="trend-bar"><span style="width:${Math.round(count/trendMax*100)}%"></span></span><strong>${count}</strong></button>`}).join(''):'<div class="empty">Noch keine vergangenen Events.</div>'}</section>`}
function customerStatusOptions(selected){return `<option value="none" ${selected==='none'?'selected':''}>Kein Kunde</option><option value="before_event" ${selected==='before_event'?'selected':''}>Bereits Kunde</option><option value="through_event" ${selected==='through_event'?'selected':''}>Durch Event gewonnen</option>`}
function enhanceCustomerForm(){const personField=$('#pCustomer')?.parentElement,guestField=$('#gCustomer')?.parentElement;if(personField){const selected=modal==='editPerson'?customerStatus(getPerson(selectedPersonId)):'none';personField.innerHTML=`<label for="pCustomerStatus">Kundenstatus</label><select id="pCustomerStatus" class="input">${customerStatusOptions(selected)}</select>`;personField.style.marginTop='12px'}if(guestField){guestField.innerHTML=`<label for="gCustomerStatus">Kundenstatus</label><select id="gCustomerStatus" class="input">${customerStatusOptions('none')}</select>`;guestField.style.marginTop='12px'}}
function lastAttendedEvent(personId){return personHistory(personId).find(({a,e})=>a.attended&&e.status!=='Abgesagt'&&e.event_date<=localToday())?.e||null}
function absenceCard(){const today=new Date(localToday()+'T12:00:00'),rows=people.map(person=>{const event=lastAttendedEvent(person.id);return event?{person,event,days:Math.floor((today-new Date(event.event_date+'T12:00:00'))/86400000)}:null}).filter(row=>row&&row.days>=absenceDays).sort((a,b)=>b.days-a.days||a.person.name.localeCompare(b.person.name));return `<section class="card" style="margin-top:16px"><div class="page-head" style="margin-bottom:10px"><div><h3 class="section-title" style="margin-bottom:4px">👋 Lange nicht gesehen</h3><div class="meta">Personen, die früher teilgenommen haben.</div></div><select aria-label="Zeitraum für lange nicht gesehen" style="width:auto" onchange="absenceDays=Number(this.value);render()"><option value="30" ${absenceDays===30?'selected':''}>30 Tage</option><option value="60" ${absenceDays===60?'selected':''}>60 Tage</option><option value="90" ${absenceDays===90?'selected':''}>90 Tage</option></select></div>${rows.length?rows.map(({person,event,days})=>`<div class="row"><button class="person-link" onclick="openPersonDetail('${person.id}')"><span class="person-name">${esc(person.name)}</span><span class="meta">Zuletzt am ${fmt(event.event_date)} · vor ${days} Tagen</span></button><span class="badge">${visits(person.id)} Besuche</span></div>`).join(''):`<div class="empty">Für diesen Zeitraum ist niemand überfällig.</div>`}</section>`}

function personRow(p){const st=status(p.id),referrer=getPerson(p.referred_by),customer=customerStatus(p);return `<div class="row"><button class="person-link" onclick="openPersonDetail('${p.id}')"><span class="person-name">${esc(p.name)}</span><span class="meta">${visits(p.id)} Besuche${referrer?' · Mitgebracht von '+esc(referrer.name):''}</span></button><div class="badges"><span class="badge ${st[1]}">${st[2]} ${st[0]}</span>${customer!=='none'?`<span class="badge customer">💼 ${customerStatusLabel(customer)}</span>`:''}<button class="btn ghost" onclick="openEditPerson('${p.id}')">Kundenstatus</button></div></div>`}

function visitStreak(id){const relevant=personHistory(id).filter(({e})=>e.status!=='Abgesagt'&&(e.event_date<localToday()||e.status==='Abgeschlossen'));let count=0;for(const {a} of relevant){if(!a.attended)break;count++}return count}

function eventDetail(){const e=events.find(x=>x.id===selectedEventId);if(!e)return eventsPage();const rows=evParts(e.id).map(a=>({a,p:getPerson(a.person_id)})).filter(x=>x.p).sort((x,y)=>x.p.name.localeCompare(y.p.name));const s=evStats(e.id),noShows=noShowsForEvent(e);return `<div class="page-head"><div><div class="kicker">${fmt(e.event_date)}</div><h2>${esc(e.title)}</h2><p>${s.yes} Zusagen · ${s.attended} Teilnehmer · ${noShows} No-Shows</p><p class="meta">${e.location?esc(e.location)+' · ':''}${e.start_time?esc(e.start_time.slice(0,5))+(e.end_time?'–'+esc(e.end_time.slice(0,5)):'')+' · ':''}${esc(e.status||'Geplant')}</p>${e.notes?`<p class="meta">${esc(e.notes)}</p>`:''}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary" onclick="exportEvent('${e.id}')">CSV herunterladen</button><button class="btn secondary" onclick="openEditEvent('${e.id}')">Event bearbeiten</button><button class="btn secondary" onclick="openCopyEvent('${e.id}')">Event kopieren</button><button class="btn secondary" onclick="openExistingPerson('${e.id}')">+ Person hinzufügen</button><button class="btn" onclick="openGuest('${e.id}')">+ Neuer Gast</button></div></div><section class="card"><h3 class="section-title">Teilnehmerverwaltung</h3>${rows.length?rows.map(({a,p})=>`<div class="row"><div><div class="person-name">${esc(p.name)}</div><div class="meta">${visits(p.id)} bisherige Besuche</div></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><div class="rsvp"><button class="${a.response==='yes'?'active yes':''}" onclick="setRsvp('${a.id}','yes')">Zusage</button><button class="${a.response==='no'?'active no':''}" onclick="setRsvp('${a.id}','no')">Absage</button><button class="${a.response==='none'?'active':''}" onclick="setRsvp('${a.id}','none')">Offen</button></div><button class="check ${a.attended?'checked':''}" aria-label="Teilnahme von ${esc(p.name)} ändern" title="Teilnahme ändern" onclick="setAttend('${a.id}', function restoreModal(){const preview=restoreData?`<div class="notice success">${restoreData.persons.length} Personen, ${restoreData.events.length} Events und ${restoreData.participations.length} Teilnahmen erkannt. Vorhandene Einträge werden aktualisiert; fehlende werden ergänzt.</div>`:restoreError?notice(restoreError,'error'):'<div class="notice">Wähle eine zuvor heruntergeladene Community-Tracker-Sicherung aus.</div>';return modalShell('Sicherung wiederherstellen',`<div class="field"><label>Sicherungsdatei</label><input id="backupFile" class="input" type="file" accept="application/json,.json" onchange="inspectBackup(this.files[0])"></div>${preview}`,restoreData?'restoreBackup()':null,restoreData?'Sicherung einspielen':'Speichern')}
function adminPage(){const rows=workspaceMembers.map((member,index)=>`<div class="row"><div><div class="person-name member-email">${esc(member.email)}</div><div class="meta">${member.role==='admin'?'Admin · voller Zugriff':`Nur Lesen · ${member.registered?'Konto aktiv':'noch nicht registriert'}`}</div></div>${member.role==='viewer'?`<button class="btn ghost remove-person" onclick="removeViewerAt(${index})">Entfernen</button>`:''}</div>`).join('');return `<div class="page-head"><div><div class="kicker">Nur für dich</div><h2>Verwaltung</h2><p>Konten, Rollen und Zugriffe auf deinen Community Tracker.</p></div></div><section class="card"><div class="grid stats" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:16px"><div><div class="stat-label">Personen</div><div class="stat-value">${people.length}</div></div><div><div class="stat-label">Events</div><div class="stat-value">${events.length}</div></div><div><div class="stat-label">Konten</div><div class="stat-value">${workspaceMembers.length}</div></div></div><p class="meta">Hier verwaltest du die Zugriffe auf deinen Bereich. Nur dein Admin-Konto sieht diese Seite.</p><div class="field" style="margin-top:16px"><label>E-Mail für Nur-Lesen-Zugriff</label><div style="display:flex;gap:8px"><input id="viewerEmail" class="input" type="email" placeholder="kollege@beispiel.de"><button class="btn" onclick="addViewer()">Freigeben</button></div></div><section style="margin-top:18px"><h4 style="margin:0 0 6px">Konten in deinem Bereich</h4>${rows||'<div class="empty">Noch keine Konten freigegeben.</div>'}</section></section>`}
function accessModal(){const rows=workspaceMembers.map((member,index)=>`<div class="row"><div><div class="person-name member-email">${esc(member.email)}</div><div class="meta">${member.role==='admin'?'Admin · voller Zugriff':`Nur Lesen · ${member.registered?'Konto aktiv':'noch nicht registriert'}`}</div></div>${member.role==='viewer'?`<button class="btn ghost remove-person" onclick="removeViewerAt(${index})">Entfernen</button>`:''}</div>`).join('');return modalShell('Admin-Bereich · Zugriff',`<div class="grid stats" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:16px"><div><div class="stat-label">Personen</div><div class="stat-value">${people.length}</div></div><div><div class="stat-label">Events</div><div class="stat-value">${events.length}</div></div><div><div class="stat-label">Konten</div><div class="stat-value">${workspaceMembers.length}</div></div></div><p class="meta">Hier siehst du, wer Zugriff auf deinen Bereich hat und ob das Konto bereits registriert ist. Neue Nutzer können auch einen eigenen getrennten Bereich anlegen.</p><div class="field" style="margin-top:16px"><label>E-Mail für Nur-Lesen-Zugriff</label><div style="display:flex;gap:8px"><input id="viewerEmail" class="input" type="email" placeholder="kollege@beispiel.de"><button class="btn" onclick="addViewer()">Freigeben</button></div></div><section style="margin-top:18px"><h4 style="margin:0 0 6px">Konten in deinem Bereich</h4>${rows||'<div class="empty">Noch keine Konten freigegeben.</div>'}</section>`,null)}
function renderModal(){if(!modal)return'';if(modal==='restore')return restoreModal();if(modal==='access')return accessModal();if(modal==='person')return modalShell('Person hinzufügen',`<div class="field"><label>Name</label><input id="pName" class="input"></div><div class="field" style="margin-top:12px"><label><input id="pCustomer" type="checkbox"> Kunde</label></div><div class="field" style="margin-top:12px"><label>Ursprünglich mitgebracht von</label><select id="pReferrer">${referrerOptions()}</select></div>`,`addPerson()`);if(modal==='editPerson'){const p=getPerson(selectedPersonId);return p?modalShell('Person bearbeiten',`<div class="field"><label>Name</label><input id="pName" class="input" value="${esc(p.name)}"></div><div class="field" style="margin-top:12px"><label><input id="pCustomer" type="checkbox" ${p.customer?'checked':''}> Kunde</label></div><div class="field" style="margin-top:12px"><label>Ursprünglich mitgebracht von</label><select id="pReferrer">${referrerOptions(p.id,p.referred_by)}</select></div>`,'savePerson()'):''}if(modal==='event'){const source=events.find(e=>e.id===eventTemplateId),selected=source?new Set(evParts(source.id).map(a=>a.person_id)):null;return modalShell(source?'Event kopieren':'Event erstellen',eventForm(source?{...source,event_date:'',status:'Geplant'}:{title:'Mario Kart Abend',status:'Geplant'})+eventInviteForm(selected),`addEvent()`)}if(modal==='editEvent'){const e=events.find(x=>x.id===selectedEventId);return e?modalShell('Event bearbeiten',eventForm(e),`saveEvent()`):''}if(modal==='existingPerson'){const available=people.filter(p=>!evParts(selectedEventId).some(a=>a.person_id===p.id));return modalShell('Person zum Event hinzufügen',available.length?`<div class="field"><label>Person</label><select id="existingPerson"><option value="">Bitte auswählen</option>${available.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Antwort</label><select id="existingResponse"><option value="none">Offen</option><option value="yes">Zusage</option><option value="no">Absage</option></select></div><div class="field" style="margin-top:12px"><label><input id="existingAttended" type="checkbox"> Hat teilgenommen</label></div>`:'<div class="empty">Alle erfassten Personen sind bereits bei diesem Event.</div>',available.length?'addExistingPerson()':null)}if(modal==='guest')return modalShell('Neuen Gast hinzufügen',`<div class="field"><label>Name</label><input id="gName" class="input"></div><div class="field" style="margin-top:12px"><label>Ursprünglich mitgebracht von</label><select id="gBy">${referrerOptions()}</select></div><div class="field" style="margin-top:12px"><label><input id="gCustomer" type="checkbox"> Kunde</label></div><div class="field" style="margin-top:12px"><label><input id="gAttended" type="checkbox"> Hat teilgenommen</label></div>`,`addGuest()`)}

async function savePerson(){const name=$('#pName').value.trim(),referred_by=$('#pReferrer').value||null,customer_status=readCustomerStatus();if(!name){alert('Bitte einen Namen eingeben.');return}if(!selectedPersonId)return;if(!['none','before_event','through_event'].includes(customer_status)){alert('Bitte einen gültigen Kundenstatus auswählen.');return}if(referred_by===selectedPersonId||referred_by&&!people.some(p=>p.id===referred_by)){alert('Bitte eine gültige Person als Mitbringer auswählen.');return}setLoading(true);try{const {data,error}=await sb.from('persons').update({name,customer:customer_status!=='none',customer_status,referred_by}).eq('id',selectedPersonId).eq('user_id',session.user.id).select('id');if(error)throw error;if(!data?.length)throw new Error('Person konnte nicht gespeichert werden.');modal=null;await loadAll()}catch(error){alert(error.message||'Speichern fehlgeschlagen.')}finally{setLoading(false)}}
function eventInput(){const title=$('#eTitle').value.trim(),event_date=$('#eDate').value,start_time=$('#eStart').value||null,end_time=$('#eEnd').value||null;if(!title||!event_date){alert('Bitte Titel und Datum eingeben.');return null}const status=$('#eStatus').value;if(!['Geplant','Abgeschlossen','Abgesagt'].includes(status)){alert('Bitte einen gültigen Event-Status wählen.');return null}return{title,event_date,start_time,end_time,status,location:$('#eLocation').value.trim()||null,notes:$('#eNotes').value.trim()||null}}
function modalShell(title,body,save,saveLabel='Speichern'){return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="btn ghost" onclick="closeModal()">✕</button></div>${body}<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Abbrechen</button>${save?`<button class="btn" onclick="${save}">${saveLabel}</button>`:''}</div></div></div>`}
function inspectBackup(file){restoreData=null;restoreError='';if(!file){render();return}if(file.size>10*1024*1024){restoreError='Die Sicherungsdatei ist zu groß (maximal 10 MB).';render();return}const reader=new FileReader();reader.onload=event=>{try{const value=JSON.parse(event.target.result);if(value?.format!=='community-tracker-backup'||value?.version!==1)throw new Error('Diese Datei ist keine gültige Community-Tracker-Sicherung.');if(!Array.isArray(value.persons)||!Array.isArray(value.events)||!Array.isArray(value.participations))throw new Error('Die Sicherung enthält nicht alle benötigten Bereiche.');restoreData={format:value.format,version:value.version,persons:value.persons,events:value.events,participations:value.participations};}catch(error){restoreError=error.message||'Die Sicherungsdatei konnte nicht gelesen werden.'}render()};reader.onerror=()=>{restoreError='Die Sicherungsdatei konnte nicht gelesen werden.';render()};reader.readAsText(file)}
async function restoreBackup(){if(!isAdmin()||!restoreData)return;const counts=`${restoreData.persons.length} Personen, ${restoreData.events.length} Events und ${restoreData.participations.length} Teilnahmen`;if(!confirm(`${counts} wiederherstellen? Bestehende Einträge mit gleicher ID werden aktualisiert, andere ergänzt.`))return;setLoading(true);try{const {data,error}=await sb.rpc('restore_backup',{p_backup:restoreData});if(error)throw error;restoreData=null;restoreError='';modal=null;await loadAll()}catch(error){alert(error.message||'Die Sicherung konnte nicht eingespielt werden.')}finally{setLoading(false)}}
async function refreshWorkspaceMembers(){if(!isAdmin())return;const {data,error}=await sb.rpc('get_workspace_members');if(error)throw error;workspaceMembers=data||[]}
async function addViewer(){if(!isAdmin())return;const email=$('#viewerEmail').value.trim().toLowerCase();if(!email){alert('Bitte eine E-Mail-Adresse eingeben.');return}setLoading(true);try{const {data,error}=await sb.rpc('add_workspace_viewer',{p_email:email});if(error)throw error;if(data!==true)throw new Error('Diese Adresse gehört bereits zum Admin-Konto.');await refreshWorkspaceMembers();render()}catch(error){alert(error.message||'Der Zugriff konnte nicht freigegeben werden.')}finally{setLoading(false)}}
function removeViewerAt(index){const member=workspaceMembers[index];if(member?.role==='viewer')removeViewer(member.email)}
async function removeViewer(email){if(!isAdmin())return;if(!confirm(`Nur-Lesen-Zugriff für ${email} entfernen?`))return;setLoading(true);try{const {data,error}=await sb.rpc('remove_workspace_viewer',{p_email:email});if(error)throw error;if(data!==true)throw new Error('Der Zugriff wurde nicht gefunden.');await refreshWorkspaceMembers();render()}catch(error){alert(error.message||'Der Zugriff konnte nicht entfernt werden.')}finally{setLoading(false)}}
async function addPerson(){const name=$('#pName').value.trim(),referred_by=$('#pReferrer').value||null,customer_status=readCustomerStatus();if(!name){alert('Bitte einen Namen eingeben.');return}if(!['none','before_event','through_event'].includes(customer_status)){alert('Bitte einen gültigen Kundenstatus auswählen.');return}if(referred_by&&!people.some(p=>p.id===referred_by)){alert('Bitte eine gültige Person als Mitbringer auswählen.');return}setLoading(true);try{const {error}=await sb.from('persons').insert({name,customer:customer_status!=='none',customer_status,referred_by,user_id:session.user.id});if(error)throw error;modal=null;await loadAll()}catch(error){alert(error.message||'Person konnte nicht angelegt werden.')}finally{setLoading(false)}}
async function toggleCustomer(id,val){const customer_status=val?'before_event':'none';setLoading(true);const {error}=await sb.from('persons').update({customer:val,customer_status}).eq('id',id);setLoading(false);if(error)return alert(error.message);await loadAll()}
async function addEvent(){if(!$('#loading').classList.contains('hidden'))return;const values=eventInput();if(!values)return;const selectedIds=[...document.querySelectorAll('.event-person:checked')].map(input=>input.value).filter(id=>people.some(p=>p.id===id));setLoading(true);try{const {data,error}=await sb.from('events').insert({...values,user_id:session.user.id}).select().single();if(error)throw error;selectedEventId=data.id;eventTemplateId=null;route='event';modal=null;if(selectedIds.length){const rows=selectedIds.map(person_id=>({event_id:data.id,person_id,response:'none',attended:false}));const result=await sb.from('participations').insert(rows);if(result.error){await loadAll();alert('Event wurde erstellt, aber die ausgewählten Personen konnten nicht hinzugefügt werden: '+result.error.message);return}}await loadAll()}catch(error){alert(error.message||'Event konnte nicht erstellt werden.')}finally{setLoading(false)}}
async function saveEvent(){if(!$('#loading').classList.contains('hidden'))return;const values=eventInput();if(!values||!selectedEventId)return;setLoading(true);try{const {data,error}=await sb.from('events').update(values).eq('id',selectedEventId).eq('user_id',session.user.id).select('id');if(error)throw error;if(!data?.length)throw new Error('Event konnte nicht gespeichert werden.');modal=null;await loadAll()}catch(error){alert(error.message||'Speichern fehlgeschlagen. Bitte erneut versuchen.')}finally{setLoading(false)}}
async function addExistingPerson(){const eventId=selectedEventId,personId=$('#existingPerson').value;if(!eventId||!personId){alert('Bitte eine Person auswählen.');return}if(!events.some(e=>e.id===eventId)||!people.some(p=>p.id===personId)||evParts(eventId).some(a=>a.person_id===personId)){alert('Diese Person ist bereits beim Event oder das Event ist nicht verfügbar.');return}setLoading(true);try{const {error}=await sb.from('participations').insert({event_id:eventId,person_id:personId,response:$('#existingResponse').value,attended:$('#existingAttended').checked});if(error)throw error;modal=null;await loadAll()}catch(error){alert(error.message||'Person konnte nicht hinzugefügt werden.')}finally{setLoading(false)}}
async function addGuest(){const name=$('#gName').value.trim(),referred_by=$('#gBy').value||null,customer_status=readCustomerStatus();if(!name)return;if(!['none','before_event','through_event'].includes(customer_status)){alert('Bitte einen gültigen Kundenstatus auswählen.');return}if(referred_by&&!people.some(p=>p.id===referred_by)){alert('Bitte eine gültige Person als Mitbringer auswählen.');return}setLoading(true);const {data:p,error}=await sb.from('persons').insert({name,customer:customer_status!=='none',customer_status,referred_by,user_id:session.user.id}).select().single();if(error){setLoading(false);return alert(error.message)}const r=await sb.from('participations').insert({event_id:selectedEventId,person_id:p.id,response:'none',attended:$('#gAttended').checked,brought_by:referred_by});setLoading(false);if(r.error)return alert(r.error.message);modal=null;await loadAll()}
async function setRsvp(id,response){const {error}=await sb.from('participations').update({response}).eq('id',id);if(error)return alert(error.message);await loadAll()}
async function setAttend(id,attended){const {error}=await sb.from('participations').update({attended}).eq('id',id);if(error)return alert(error.message);await loadAll()}
async function removeParticipant(id){const entry=participations.find(a=>a.id===id&&a.event_id===selectedEventId),person=entry&&getPerson(entry.person_id),event=events.find(e=>e.id===selectedEventId);if(!entry||!person||!event)return;if(!confirm(`${person.name} aus „${event.title}“ entfernen? Die Person bleibt in deiner Personenliste.`))return;setLoading(true);try{const {data,error}=await sb.from('participations').delete().eq('id',entry.id).eq('event_id',event.id).select('id');if(error)throw error;if(!data?.length)throw new Error('Die Person konnte nicht aus dem Event entfernt werden.');await loadAll()}catch(error){alert(error.message||'Entfernen fehlgeschlagen.')}finally{setLoading(false)}}
async function deletePerson(id){const person=getPerson(id);if(!person)return;if(!confirm(`${person.name} endgültig löschen? Dabei wird die Person auch aus allen Events und Statistiken entfernt.`))return;setLoading(true);try{const {data,error}=await sb.rpc('delete_person',{p_person_id:id});if(error)throw error;if(data!==true)throw new Error('Die Person wurde nicht gefunden oder darf nicht gelöscht werden.');selectedPersonId=null;route='people';await loadAll()}catch(error){alert(error.message||'Person konnte nicht gelöscht werden.')}finally{setLoading(false)}}
async function deleteEvent(id){const event=events.find(e=>e.id===id);if(!event)return;if(!confirm(`„${event.title}“ endgültig löschen? Dabei werden auch alle Zusagen und Teilnahmen dieses Events entfernt.`))return;setLoading(true);try{const {data,error}=await sb.rpc('delete_event',{p_event_id:id});if(error)throw error;if(data!==true)throw new Error('Das Event wurde nicht gefunden oder darf nicht gelöscht werden.');selectedEventId=null;route='events';await loadAll()}catch(error){alert(error.message||'Event konnte nicht gelöscht werden.')}finally{setLoading(false)}}
init();
</script>
</body>
</html>
