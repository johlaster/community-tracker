<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Community Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#f5f7fb;--surface:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--primary:#111827;--soft:#eef0f4;--success:#12805c;--success-soft:#e8f7f1;--blue:#2563eb;--blue-soft:#eff6ff;--gold:#9a6700;--gold-soft:#fff8db;--danger:#c2413b;--danger-soft:#fff0ef;--radius:18px;--shadow:0 12px 30px rgba(15,23,42,.07)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .topbar{position:sticky;top:0;z-index:10;background:rgba(245,247,251,.93);backdrop-filter:blur(14px);border-bottom:1px solid rgba(229,231,235,.8)}.topbar-inner{max-width:1120px;margin:auto;min-height:68px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--primary);color:white;font-size:20px;box-shadow:var(--shadow)}.brand h1{font-size:18px;margin:0}.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
    .container{max-width:1120px;margin:auto;padding:24px 18px 100px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}.page-head h2{margin:0;font-size:clamp(24px,4vw,34px);letter-spacing:-.04em}.page-head p{color:var(--muted);margin:6px 0 0}.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}
    .grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.two-col{grid-template-columns:1.2fr .8fr}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.stat-label{color:var(--muted);font-size:13px}.stat-value{font-size:29px;font-weight:750;margin-top:8px;letter-spacing:-.04em}.stat-note{color:var(--muted);font-size:12px;margin-top:4px}.section-title{margin:0 0 14px;font-size:17px}.list{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.person-name{font-weight:700}.person-link{border:0;background:transparent;text-align:left;padding:0;color:inherit}.person-link:hover .person-name{text-decoration:underline}.person-link .meta{display:block}.stat-date{font-size:clamp(16px,2vw,25px)}.meta{color:var(--muted);font-size:13px;margin-top:3px}.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.badge{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap;background:var(--soft)}.badge.first{color:var(--success);background:var(--success-soft)}.badge.new{color:var(--blue);background:var(--blue-soft)}.badge.regular{color:var(--gold);background:var(--gold-soft)}.badge.customer{color:#6d28d9;background:#f4efff}.badge.no-show{color:var(--danger);background:var(--danger-soft)}
    .btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--primary);color:white}.btn.secondary{background:white;color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--text);padding:8px 10px}.btn.danger{background:var(--danger)}.remove-person{color:var(--danger);white-space:nowrap}.remove-person:hover{background:var(--danger-soft)}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.input,select,textarea{width:100%;background:white;border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--text);outline:none}.search{flex:1;min-width:210px}.event-filter{width:auto;min-width:170px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:700}.field.full{grid-column:1/-1}.event-people{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:4px 12px}.event-person-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}.event-person-row:last-child{border-bottom:0}.event-person-row input{width:18px;height:18px;margin:0}
    .nav{position:fixed;z-index:20;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 16px 36px rgba(15,23,42,.16);border-radius:18px;padding:6px}.nav button{width:92px;border:0;background:transparent;padding:9px 8px;border-radius:13px;color:var(--muted);font-size:12px;font-weight:700}.nav button span{display:block;font-size:19px;margin-bottom:2px}.nav button.active{background:var(--primary);color:white}
    .modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.46);display:grid;place-items:end center;padding:16px}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:white;border-radius:22px;box-shadow:0 24px 70px rgba(15,23,42,.25);padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h3{margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.empty{color:var(--muted);text-align:center;padding:32px 10px}.check{width:27px;height:27px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;background:white;color:white;flex:0 0 auto}.check.checked{background:var(--success);border-color:var(--success)}.rsvp{display:flex;gap:5px}.rsvp button{border:1px solid var(--line);background:white;padding:7px 9px;border-radius:9px;font-size:12px;font-weight:700}.rsvp button.active.yes{background:var(--success-soft);color:var(--success)}.rsvp button.active.no{background:var(--danger-soft);color:var(--danger)}
    .hero{padding:22px;background:linear-gradient(135deg,#111827,#334155);color:white;border:0}.hero .meta{color:rgba(255,255,255,.72)}.hero-number{font-size:44px;font-weight:800;letter-spacing:-.05em;margin:10px 0 2px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(470px,100%)}.login-card h1{margin:0 0 8px}.notice{padding:12px 14px;border-radius:12px;background:var(--blue-soft);color:#1e40af;font-size:13px;line-height:1.5;margin:14px 0}.error{background:var(--danger-soft);color:var(--danger)}.success{background:var(--success-soft);color:var(--success)}.small{font-size:12px;color:var(--muted);line-height:1.5}.loading{position:fixed;inset:0;z-index:100;background:rgba(245,247,251,.75);backdrop-filter:blur(3px);display:grid;place-items:center;font-weight:800}
    @media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}}@media(max-width:560px){.container{padding:18px 12px 92px}.topbar-inner{padding:10px 12px}.stats{gap:10px}.card{padding:15px;border-radius:16px}.stat-value{font-size:24px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.nav{bottom:8px;width:calc(100% - 16px);justify-content:space-around}.nav button{width:auto;flex:1;padding:8px 4px}.row{align-items:flex-start}}
  </style>
</head>
<body>
<div id="app"></div><div id="loading" class="loading hidden">Wird geladen …</div>
<script>
const DEFAULT_CONFIG={url:'https://bzzruvkmwaekxxzrmywv.supabase.co',key:'sb_publishable_TCOoaED0wEn82aCGweE1-Q_ICzKG-Ks'};
let sb=null, session=null, route='dashboard', modal=null, selectedEventId=null, selectedPersonId=null, search='', eventFilter='Alle';
let recoveryMode=location.hash.includes('type=recovery');
let people=[], events=[], participations=[];
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt=d=>new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d+'T12:00:00'));
const localToday=()=>{const now=new Date();return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`}
function setLoading(v){$('#loading')?.classList.toggle('hidden',!v)}
function notice(msg,type='notice'){return `<div class="notice ${type}">${esc(msg)}</div>`}
async function init(){const c=DEFAULT_CONFIG; try{sb=supabase.createClient(c.url,c.key); const {data}=await sb.auth.getSession(); session=data.session; sb.auth.onAuthStateChange((event,s)=>{session=s;if(event==='PASSWORD_RECOVERY')recoveryMode=true;if(recoveryMode){renderPasswordRecovery();return}if(session)loadAll();else renderLogin()}); if(recoveryMode)renderPasswordRecovery();else if(session)await loadAll();else renderLogin()}catch(e){document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="card login-card"><h1>Verbindung fehlgeschlagen</h1>${notice(e.message,'error')}<button class="btn" onclick="location.reload()">Erneut versuchen</button></div></div>`}}
function renderLogin(msg=''){document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="card login-card"><div class="logo">🎮</div><h1 style="margin-top:16px">Community Tracker</h1><p class="meta">Mit demselben Konto am Hauptrechner und Laptop anmelden.</p>${msg?notice(msg):''}<div class="field"><label>E-Mail</label><input id="email" class="input" type="email"></div><div class="field" style="margin-top:12px"><label>Passwort</label><input id="password" class="input" type="password"></div><button class="btn" style="width:100%;margin-top:16px" onclick="login()">Anmelden</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="signup()">Konto anlegen</button><button class="btn ghost" style="width:100%;margin-top:6px" onclick="requestPasswordReset()">Passwort vergessen?</button><div id="loginMsg"></div></div></div>`}
async function login(){setLoading(true);const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});setLoading(false);if(error)$('#loginMsg').innerHTML=notice(error.message,'error')}
async function signup(){setLoading(true);const {error}=await sb.auth.signUp({email:$('#email').value.trim(),password:$('#password').value});setLoading(false);$('#loginMsg').innerHTML=error?notice(error.message,'error'):notice('Konto angelegt. Prüfe gegebenenfalls deine E-Mails und bestätige die Anmeldung.','success')}
async function requestPasswordReset(){const email=$('#email').value.trim();if(!email){$('#loginMsg').innerHTML=notice('Bitte zuerst deine E-Mail-Adresse eingeben.','error');return}setLoading(true);const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});setLoading(false);$('#loginMsg').innerHTML=error?notice(error.message,'error'):notice('Falls für diese Adresse ein Konto besteht, bekommst du einen Link zum Zurücksetzen.','success')}
function renderPasswordRecovery(){document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="card login-card"><div class="logo">🎮</div><h1 style="margin-top:16px">Neues Passwort setzen</h1><p class="meta">Wähle ein neues Passwort für deinen Community Tracker.</p><div class="field" style="margin-top:16px"><label>Neues Passwort</label><input id="newPassword" class="input" type="password" autocomplete="new-password"></div><div class="field" style="margin-top:12px"><label>Passwort wiederholen</label><input id="confirmPassword" class="input" type="password" autocomplete="new-password"></div><button class="btn" style="width:100%;margin-top:16px" onclick="saveNewPassword()">Passwort speichern</button><div id="recoveryMsg"></div></div></div>`}
async function saveNewPassword(){const password=$('#newPassword').value,confirm=$('#confirmPassword').value;if(password.length<8){$('#recoveryMsg').innerHTML=notice('Das Passwort muss mindestens 8 Zeichen haben.','error');return}if(password!==confirm){$('#recoveryMsg').innerHTML=notice('Die Passwörter stimmen nicht überein.','error');return}setLoading(true);const {error}=await sb.auth.updateUser({password});setLoading(false);if(error){$('#recoveryMsg').innerHTML=notice(error.message,'error');return}recoveryMode=false;history.replaceState(null,'',location.pathname);await loadAll()}
async function logout(){await sb.auth.signOut()}
async function loadAll(){setLoading(true);const [p,e,a]=await Promise.all([sb.from('persons').select('*').order('name'),sb.from('events').select('*').order('event_date',{ascending:false}),sb.from('participations').select('*')]);setLoading(false);const err=p.error||e.error||a.error;if(err){document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="card login-card"><h1>Daten konnten nicht geladen werden</h1>${notice(err.message,'error')}<p class="small">Meist fehlen noch API-Berechtigungen oder die Sicherheitseinstellungen.</p><button class="btn secondary" onclick="logout()">Abmelden</button></div></div>`;return}people=p.data||[];events=e.data||[];participations=a.data||[];render()}
function visits(id){return participations.filter(a=>a.person_id===id&&a.attended).length}function status(id){const v=visits(id);return v<=1?['Erstbesuch','first','🟢']:v===2?['Neu','new','🔵']:['Stammgast','regular','⭐']}function evParts(id){return participations.filter(a=>a.event_id===id)}function evStats(id){const r=evParts(id);return{yes:r.filter(x=>x.response==='yes').length,attended:r.filter(x=>x.attended).length,noShows:r.filter(x=>x.response==='yes'&&!x.attended).length,total:r.length}}function getPerson(id){return people.find(p=>p.id===id)}
function layout(content){return `<header class="topbar"><div class="topbar-inner"><div class="brand"><div class="logo">🎮</div><div><h1>Community Tracker</h1><p>${esc(session?.user?.email||'')}</p></div></div><div style="display:flex;gap:8px"><button class="btn" onclick="openEvent()">+ Event</button><button class="btn secondary" onclick="logout()">Abmelden</button></div></div></header><main class="container">${content}</main><nav class="nav">${nav('dashboard','⌂','Dashboard')}${nav('events','◫','Events')}${nav('people','♙','Personen')}</nav>${renderModal()}`}
function nav(r,i,l){return `<button class="${route===r?'active':''}" onclick="go('${r}')"><span>${i}</span>${l}</button>`}function go(r){route=r;selectedEventId=null;selectedPersonId=null;render()}
function render(){let c=route==='dashboard'?dashboard():route==='events'?eventsPage():route==='people'?peoplePage():route==='person'?personDetail():eventDetail();document.getElementById('app').innerHTML=layout(c)}
function dashboard(){const now=new Date();const today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;const past=events.filter(e=>e.event_date<today&&e.status!=='Abgesagt');const next=[...events].filter(e=>e.event_date>=today&&(!e.status||e.status==='Geplant')).sort((a,b)=>a.event_date.localeCompare(b.event_date))[0];const last=[...events].filter(e=>e.event_date<today&&e.status!=='Abgesagt').sort((a,b)=>b.event_date.localeCompare(a.event_date))[0];const s=last?evStats(last.id):{yes:0,attended:0,noShows:0};const regulars=people.filter(p=>visits(p.id)>=3).length,customers=people.filter(p=>p.customer).length,reliability=s.yes?Math.round(s.attended/s.yes*100):0;const average=past.length?(participations.filter(a=>a.attended&&past.some(e=>e.id===a.event_id)).length/past.length).toFixed(1).replace('.',','):'0';const growthSince=new Date(now.getTime()-30*86400000),newPeople=people.filter(p=>p.created_at&&new Date(p.created_at)>=growthSince).length;const topGuests=[...people].filter(p=>visits(p.id)>0).sort((a,b)=>visits(b.id)-visits(a.id)||a.name.localeCompare(b.name)).slice(0,5);const refs=people.map(p=>({...p,count:participations.filter(a=>a.brought_by===p.id).length})).filter(p=>p.count).sort((a,b)=>b.count-a.count);return `<div class="page-head"><div><div class="kicker">Überblick</div><h2>Deine Community</h2><p>Live-Daten aus Supabase.</p></div></div><div class="grid stats">${stat('Personen',people.length,`${newPeople} neu in den letzten 30 Tagen`)}${stat('Events',events.length,'Insgesamt erfasst')}${stat('Kunden',customers,`${regulars} Stammgäste`)}${stat('Ø Teilnehmer',average,'Pro Event')}</div><div class="grid two-col" style="margin-top:16px"><section class="card"><h3 class="section-title">📅 Nächstes Event</h3>${next?`<div class="person-name">${esc(next.title)}</div><div class="meta">${fmt(next.event_date)} · ${evStats(next.id).yes} Zusagen</div>`:'<div class="empty">Noch kein Event geplant.</div>'}</section><section class="card"><h3 class="section-title">🏁 Letztes Event</h3>${last?`<div class="person-name">${esc(last.title)}</div><div class="meta">${fmt(last.event_date)} · ${s.attended} Teilnehmer</div>`:'<div class="empty">Noch kein vergangenes Event.</div>'}</section></div><div class="grid two-col" style="margin-top:16px"><section class="card hero"><div class="kicker" style="color:#ffffffaa">Zuverlässigkeit letztes Event</div><div class="hero-number">${reliability} %</div><div class="meta">${s.attended} von ${s.yes} Zusagen sind gekommen.</div></section><section class="card"><h3 class="section-title">🏆 Top-Zuträger</h3>${refs.length?refs.slice(0,5).map((p,i)=>`<div class="row"><div><div class="person-name">${i+1}. ${esc(p.name)}</div><div class="meta">${p.count} Personen mitgebracht</div></div><span class="badge">${p.count}</span></div>`).join(''):'<div class="empty">Noch keine Empfehlungen erfasst.</div>'}</section></div><section class="card" style="margin-top:16px"><h3 class="section-title">⭐ Häufigste Gäste</h3>${topGuests.length?topGuests.map((p,i)=>`<div class="row"><div><div class="person-name">${i+1}. ${esc(p.name)}</div><div class="meta">Letzter Besuch: ${(personHistory(p.id).find(x=>x.a.attended)?.e.event_date?fmt(personHistory(p.id).find(x=>x.a.attended).e.event_date):'–')}</div></div><span class="badge regular">${visits(p.id)} Besuche</span></div>`).join(''):'<div class="empty">Noch keine Besuche erfasst.</div>'}</section>`}
function stat(l,v,n){return `<div class="card"><div class="stat-label">${l}</div><div class="stat-value">${v}</div><div class="stat-note">${n}</div></div>`}
function peoplePage(){const arr=people.filter(p=>p.name.toLowerCase().includes(search.toLowerCase()));return `<div class="page-head"><div><div class="kicker">Community</div><h2>Personen</h2><p>${people.length} Personen insgesamt</p></div><button class="btn" onclick="openPerson()">+ Person</button></div><div class="toolbar"><input class="input search" placeholder="Name suchen …" value="${esc(search)}" oninput="search=this.value;render()"></div><section class="card">${arr.length?arr.map(personRow).join(''):'<div class="empty">Noch keine Personen.</div>'}</section>`}
function personRow(p){const st=status(p.id);return `<div class="row"><button class="person-link" onclick="openPersonDetail('${p.id}')"><span class="person-name">${esc(p.name)}</span><span class="meta">${visits(p.id)} Besuche</span></button><div class="badges"><span class="badge ${st[1]}">${st[2]} ${st[0]}</span>${p.customer?'<span class="badge customer">💼 Kunde</span>':''}<button class="btn ghost" onclick="toggleCustomer('${p.id}',${!p.customer})">${p.customer?'Kein Kunde':'Als Kunde'}</button></div></div>`}
function openPersonDetail(id){selectedPersonId=id;route='person';render()}
function personHistory(id){return participations.filter(a=>a.person_id===id).map(a=>({a,e:events.find(e=>e.id===a.event_id)})).filter(x=>x.e).sort((x,y)=>y.e.event_date.localeCompare(x.e.event_date))}
function personDetail(){const p=getPerson(selectedPersonId);if(!p)return peoplePage();const history=personHistory(p.id),attended=history.filter(x=>x.a.attended),last=attended[0]?.e,invited=participations.filter(a=>a.brought_by===p.id).length;const st=status(p.id);return `<div class="page-head"><div><div class="kicker">Personenprofil</div><h2>${esc(p.name)}</h2><p>${st[2]} ${st[0]}${p.customer?' · Kunde':''}</p></div><button class="btn secondary" onclick="openEditPerson('${p.id}')">Person bearbeiten</button></div><div class="grid stats"><div class="card"><div class="stat-label">Besuche</div><div class="stat-value">${attended.length}</div></div><div class="card"><div class="stat-label">Letzter Besuch</div><div class="stat-value stat-date">${last?fmt(last.event_date):'–'}</div></div><div class="card"><div class="stat-label">Zusagen</div><div class="stat-value">${history.filter(x=>x.a.response==='yes').length}</div></div><div class="card"><div class="stat-label">Mitgebracht</div><div class="stat-value">${invited}</div></div></div><section class="card" style="margin-top:16px"><h3 class="section-title">Event-Historie</h3>${history.length?history.map(({a,e})=>`<div class="row"><div><div class="person-name">${esc(e.title)}</div><div class="meta">${fmt(e.event_date)} · ${a.attended?'Teilgenommen':a.response==='yes'?'Zugesagt':a.response==='no'?'Abgesagt':'Offen'}</div></div><button class="btn ghost" onclick="openEventDetail('${e.id}')">Ansehen</button></div>`).join(''):'<div class="empty">Noch keine Events für diese Person.</div>'}</section>`}
function eventsPage(){const shown=eventFilter==='Alle'?events:events.filter(e=>(e.status||'Geplant')===eventFilter);return `<div class="page-head"><div><div class="kicker">Veranstaltungen</div><h2>Events</h2><p>Zusagen und Teilnehmer verwalten.</p></div><button class="btn" onclick="openEvent()">+ Event</button></div><div class="toolbar"><label for="eventFilter" class="meta">Status</label><select id="eventFilter" class="event-filter" onchange="eventFilter=this.value;render()"><option ${eventFilter==='Alle'?'selected':''}>Alle</option><option ${eventFilter==='Geplant'?'selected':''}>Geplant</option><option ${eventFilter==='Abgeschlossen'?'selected':''}>Abgeschlossen</option><option ${eventFilter==='Abgesagt'?'selected':''}>Abgesagt</option></select><span class="meta">${shown.length} Events</span></div><section class="card">${shown.length?shown.map(e=>{const s=evStats(e.id);return `<div class="row" onclick="openEventDetail('${e.id}')" style="cursor:pointer"><div><div class="person-name">${esc(e.title)}</div><div class="meta">${fmt(e.event_date)} · ${esc(e.status||'Geplant')}${e.location?' · '+esc(e.location):''} · ${s.yes} Zusagen · ${s.attended} Teilnehmer</div></div><span>›</span></div>`}).join(''):'<div class="empty">Keine Events für diesen Status.</div>'}</section>`}
function openEventDetail(id){selectedEventId=id;route='event';render()}
function eventDetail(){const e=events.find(x=>x.id===selectedEventId);if(!e)return eventsPage();const rows=evParts(e.id).map(a=>({a,p:getPerson(a.person_id)})).filter(x=>x.p).sort((x,y)=>x.p.name.localeCompare(y.p.name));const s=evStats(e.id),today=localToday(),noShows=e.status==='Abgesagt'?0:(e.event_date<today||e.status==='Abgeschlossen')?s.noShows:0;return `<div class="page-head"><div><div class="kicker">${fmt(e.event_date)}</div><h2>${esc(e.title)}</h2><p>${s.yes} Zusagen · ${s.attended} Teilnehmer · ${noShows} No-Shows</p><p class="meta">${e.location?esc(e.location)+' · ':''}${e.start_time?esc(e.start_time.slice(0,5))+(e.end_time?'–'+esc(e.end_time.slice(0,5)):'')+' · ':''}${esc(e.status||'Geplant')}</p>${e.notes?`<p class="meta">${esc(e.notes)}</p>`:''}</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn secondary" onclick="openEditEvent('${e.id}')">Event bearbeiten</button><button class="btn secondary" onclick="openExistingPerson('${e.id}')">+ Person hinzufügen</button><button class="btn" onclick="openGuest('${e.id}')">+ Neuer Gast</button></div></div><section class="card"><h3 class="section-title">Teilnehmerverwaltung</h3>${rows.length?rows.map(({a,p})=>`<div class="row"><div><div class="person-name">${esc(p.name)}</div><div class="meta">${visits(p.id)} bisherige Besuche</div></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><div class="rsvp"><button class="${a.response==='yes'?'active yes':''}" onclick="setRsvp('${a.id}','yes')">Zusage</button><button class="${a.response==='no'?'active no':''}" onclick="setRsvp('${a.id}','no')">Absage</button><button class="${a.response==='none'?'active':''}" onclick="setRsvp('${a.id}','none')">Offen</button></div><button class="check ${a.attended?'checked':''}" aria-label="Teilnahme von ${esc(p.name)} ändern" title="Teilnahme ändern" onclick="setAttend('${a.id}',${!a.attended})">${a.attended?'✓':''}</button><button class="btn ghost remove-person" aria-label="${esc(p.name)} aus diesem Event entfernen" onclick="removeParticipant('${a.id}')">Entfernen</button></div></div>`).join(''):'<div class="empty">Keine Personen vorhanden.</div>'}</section>`}
function openPerson(){modal='person';render()}function openEditPerson(id){selectedPersonId=id;modal='editPerson';render()}function openEvent(){modal='event';render()}function openEditEvent(id){selectedEventId=id;modal='editEvent';render()}function openExistingPerson(id){selectedEventId=id;modal='existingPerson';render()}function openGuest(id){modal='guest';selectedEventId=id;render()}function closeModal(){modal=null;render()}
function eventForm(e){return `<div class="form-grid"><div class="field"><label>Titel</label><input id="eTitle" class="input" value="${esc(e.title||'')}"></div><div class="field"><label>Datum</label><input id="eDate" class="input" type="date" value="${esc(e.event_date||'')}"></div><div class="field"><label>Beginn</label><input id="eStart" class="input" type="time" value="${esc((e.start_time||'').slice(0,5))}"></div><div class="field"><label>Ende</label><input id="eEnd" class="input" type="time" value="${esc((e.end_time||'').slice(0,5))}"></div><div class="field"><label>Ort</label><input id="eLocation" class="input" value="${esc(e.location||'')}"></div><div class="field"><label>Status</label><select id="eStatus"><option value="Geplant" ${!e.status||e.status==='Geplant'?'selected':''}>Geplant</option><option value="Abgeschlossen" ${e.status==='Abgeschlossen'?'selected':''}>Abgeschlossen</option><option value="Abgesagt" ${e.status==='Abgesagt'?'selected':''}>Abgesagt</option></select></div><div class="field full"><label>Notiz</label><textarea id="eNotes" rows="3">${esc(e.notes||'')}</textarea></div></div>`}
function eventInviteForm(){return `<div class="field" style="margin-top:18px"><label>Personen für dieses Event</label><p class="meta">Wähle aus, wer in der Teilnehmerliste stehen soll. Du kannst später weitere Personen hinzufügen.</p>${people.length?`<div style="display:flex;gap:8px;margin:10px 0"><button class="btn ghost" type="button" onclick="setEventPeople(true)">Alle auswählen</button><button class="btn ghost" type="button" onclick="setEventPeople(false)">Keine auswählen</button></div><div class="event-people">${people.map(p=>`<label class="event-person-row"><input class="event-person" type="checkbox" value="${esc(p.id)}" checked><span>${esc(p.name)}</span></label>`).join('')}</div>`:'<div class="meta">Noch keine Personen vorhanden.</div>'}</div>`}
function setEventPeople(checked){document.querySelectorAll('.event-person').forEach(input=>input.checked=checked)}
function renderModal(){if(!modal)return'';if(modal==='person')return modalShell('Person hinzufügen',`<div class="field"><label>Name</label><input id="pName" class="input"></div><div class="field" style="margin-top:12px"><label><input id="pCustomer" type="checkbox"> Kunde</label></div>`,`addPerson()`);if(modal==='editPerson'){const p=getPerson(selectedPersonId);return p?modalShell('Person bearbeiten',`<div class="field"><label>Name</label><input id="pName" class="input" value="${esc(p.name)}"></div><div class="field" style="margin-top:12px"><label><input id="pCustomer" type="checkbox" ${p.customer?'checked':''}> Kunde</label></div>`,'savePerson()'):''}if(modal==='event')return modalShell('Event erstellen',eventForm({title:'Mario Kart Abend'})+eventInviteForm(),`addEvent()`);if(modal==='editEvent'){const e=events.find(x=>x.id===selectedEventId);return e?modalShell('Event bearbeiten',eventForm(e),`saveEvent()`):''}if(modal==='existingPerson'){const available=people.filter(p=>!evParts(selectedEventId).some(a=>a.person_id===p.id));return modalShell('Person zum Event hinzufügen',available.length?`<div class="field"><label>Person</label><select id="existingPerson"><option value="">Bitte auswählen</option>${available.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Antwort</label><select id="existingResponse"><option value="none">Offen</option><option value="yes">Zusage</option><option value="no">Absage</option></select></div><div class="field" style="margin-top:12px"><label><input id="existingAttended" type="checkbox"> Hat teilgenommen</label></div>`:'<div class="empty">Alle erfassten Personen sind bereits bei diesem Event.</div>',available.length?'addExistingPerson()':null)}if(modal==='guest')return modalShell('Neuen Gast hinzufügen',`<div class="field"><label>Name</label><input id="gName" class="input"></div><div class="field" style="margin-top:12px"><label>Mitgebracht von</label><select id="gBy"><option value="">Keine Angabe</option>${people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label><input id="gCustomer" type="checkbox"> Kunde</label></div><div class="field" style="margin-top:12px"><label><input id="gAttended" type="checkbox"> Hat teilgenommen</label></div>`,`addGuest()`)}

async function savePerson(){const name=$('#pName').value.trim();if(!name){alert('Bitte einen Namen eingeben.');return}if(!selectedPersonId)return;setLoading(true);try{const {data,error}=await sb.from('persons').update({name,customer:$('#pCustomer').checked}).eq('id',selectedPersonId).eq('user_id',session.user.id).select('id');if(error)throw error;if(!data?.length)throw new Error('Person konnte nicht gespeichert werden.');modal=null;await loadAll()}catch(error){alert(error.message||'Speichern fehlgeschlagen.')}finally{setLoading(false)}}
function eventInput(){const title=$('#eTitle').value.trim(),event_date=$('#eDate').value,start_time=$('#eStart').value||null,end_time=$('#eEnd').value||null;if(!title||!event_date){alert('Bitte Titel und Datum eingeben.');return null}const status=$('#eStatus').value;if(!['Geplant','Abgeschlossen','Abgesagt'].includes(status)){alert('Bitte einen gültigen Event-Status wählen.');return null}return{title,event_date,start_time,end_time,status,location:$('#eLocation').value.trim()||null,notes:$('#eNotes').value.trim()||null}}
function modalShell(title,body,save){return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="btn ghost" onclick="closeModal()">✕</button></div>${body}<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Abbrechen</button>${save?`<button class="btn" onclick="${save}">Speichern</button>`:''}</div></div></div>`}
async function addPerson(){const name=$('#pName').value.trim();if(!name)return;setLoading(true);const {error}=await sb.from('persons').insert({name,customer:$('#pCustomer').checked,user_id:session.user.id});setLoading(false);if(error)return alert(error.message);modal=null;await loadAll()}
async function toggleCustomer(id,val){setLoading(true);const {error}=await sb.from('persons').update({customer:val}).eq('id',id);setLoading(false);if(error)return alert(error.message);await loadAll()}
async function addEvent(){if(!$('#loading').classList.contains('hidden'))return;const values=eventInput();if(!values)return;const selectedIds=[...document.querySelectorAll('.event-person:checked')].map(input=>input.value).filter(id=>people.some(p=>p.id===id));setLoading(true);try{const {data,error}=await sb.from('events').insert({...values,user_id:session.user.id}).select().single();if(error)throw error;selectedEventId=data.id;route='event';modal=null;if(selectedIds.length){const rows=selectedIds.map(person_id=>({event_id:data.id,person_id,response:'none',attended:false}));const result=await sb.from('participations').insert(rows);if(result.error){await loadAll();alert('Event wurde erstellt, aber die ausgewählten Personen konnten nicht hinzugefügt werden: '+result.error.message);return}}await loadAll()}catch(error){alert(error.message||'Event konnte nicht erstellt werden.')}finally{setLoading(false)}}
async function saveEvent(){if(!$('#loading').classList.contains('hidden'))return;const values=eventInput();if(!values||!selectedEventId)return;setLoading(true);try{const {data,error}=await sb.from('events').update(values).eq('id',selectedEventId).eq('user_id',session.user.id).select('id');if(error)throw error;if(!data?.length)throw new Error('Event konnte nicht gespeichert werden.');modal=null;await loadAll()}catch(error){alert(error.message||'Speichern fehlgeschlagen. Bitte erneut versuchen.')}finally{setLoading(false)}}
async function addExistingPerson(){const eventId=selectedEventId,personId=$('#existingPerson').value;if(!eventId||!personId){alert('Bitte eine Person auswählen.');return}if(!events.some(e=>e.id===eventId)||!people.some(p=>p.id===personId)||evParts(eventId).some(a=>a.person_id===personId)){alert('Diese Person ist bereits beim Event oder das Event ist nicht verfügbar.');return}setLoading(true);try{const {error}=await sb.from('participations').insert({event_id:eventId,person_id:personId,response:$('#existingResponse').value,attended:$('#existingAttended').checked});if(error)throw error;modal=null;await loadAll()}catch(error){alert(error.message||'Person konnte nicht hinzugefügt werden.')}finally{setLoading(false)}}
async function addGuest(){const name=$('#gName').value.trim();if(!name)return;setLoading(true);const {data:p,error}=await sb.from('persons').insert({name,customer:$('#gCustomer').checked,user_id:session.user.id}).select().single();if(error){setLoading(false);return alert(error.message)}const r=await sb.from('participations').insert({event_id:selectedEventId,person_id:p.id,response:'none',attended:$('#gAttended').checked,brought_by:$('#gBy').value||null});setLoading(false);if(r.error)return alert(r.error.message);modal=null;await loadAll()}
async function setRsvp(id,response){const {error}=await sb.from('participations').update({response}).eq('id',id);if(error)return alert(error.message);await loadAll()}
async function setAttend(id,attended){const {error}=await sb.from('participations').update({attended}).eq('id',id);if(error)return alert(error.message);await loadAll()}
async function removeParticipant(id){const entry=participations.find(a=>a.id===id&&a.event_id===selectedEventId),person=entry&&getPerson(entry.person_id),event=events.find(e=>e.id===selectedEventId);if(!entry||!person||!event)return;if(!confirm(`${person.name} aus „${event.title}“ entfernen? Die Person bleibt in deiner Personenliste.`))return;setLoading(true);try{const {data,error}=await sb.from('participations').delete().eq('id',entry.id).eq('event_id',event.id).select('id');if(error)throw error;if(!data?.length)throw new Error('Die Person konnte nicht aus dem Event entfernt werden.');await loadAll()}catch(error){alert(error.message||'Entfernen fehlgeschlagen.')}finally{setLoading(false)}}
init();
</script>
</body>
</html>
