function nav(r,i,l){return `<button class="${route===r?'active':''}" onclick="go('${r}')"><span>${i}</span>${l}</button>`}function setPotentialSection(value){potentialSection=value;try{localStorage.setItem('potentialSection',value)}catch{};render()}function go(r,push=true){route=r;selectedEventId=null;selectedPersonId=null;if(push&&typeof history!=='undefined')history.pushState({route:r},'',location.pathname+'?view='+encodeURIComponent(r));render()}if(typeof window!=='undefined')window.addEventListener('popstate',event=>{const r=event.state?.route||new URLSearchParams(location.search).get('view')||'dashboard';route=r;selectedEventId=null;selectedPersonId=null;render()});

const ACTIVE_COMMUNITY_DAYS=90;
const REGULAR_GUEST_VISITS=3;
const SECOND_VISIT_FOLLOWUP_DAYS=14;
const DASHBOARD_EVENT_WINDOW=3;
function getPastEvents(){return events.filter(e=>e.event_date&&e.event_date<localToday()&&e.status!=='Abgesagt').sort((a,b)=>a.event_date.localeCompare(b.event_date))}
function getUpcomingEvent(){return [...events].filter(e=>e.event_date&&e.event_date>=localToday()&&(!e.status||e.status==='Geplant')).sort((a,b)=>a.event_date.localeCompare(b.event_date))[0]||null}
function getAttendanceIds(eventId){const event=events.find(e=>e.id===eventId);if(!event||event.status==='Abgesagt')return[];return [...new Set(evParts(eventId).filter(a=>a.attended).map(a=>a.person_id).filter(id=>getPerson(id)))]}
function getAttendanceCount(eventId){return getAttendanceIds(eventId).length}
function getAttendedEventRows(personId){return getEventVisitSequence(personId).map(event=>({a:participations.find(row=>row.event_id===event.id&&row.person_id===personId&&row.attended),e:event})).filter(row=>row.a).sort((a,b)=>a.e.event_date.localeCompare(b.e.event_date))}
function dateDaysAgo(days){const d=new Date(localToday()+'T12:00:00');d.setDate(d.getDate()-days);return d.toISOString().slice(0,10)}
function dateDistance(from,to){if(!from||!to)return 0;return Math.round((new Date(to+'T12:00:00')-new Date(from+'T12:00:00'))/86400000)}
function formatMetric(value,digits=0){return value===null||value===undefined||!Number.isFinite(Number(value))?'–':new Intl.NumberFormat('de-DE',{minimumFractionDigits:digits,maximumFractionDigits:digits}).format(Number(value))}
function metricChange(current,previous,suffix='',inverse=false,missing='Noch kein vorheriger Vergleichszeitraum'){if(current===null||current===undefined||previous===null||previous===undefined||!Number.isFinite(Number(current))||!Number.isFinite(Number(previous)))return '<span class="metric-compare muted">'+missing+'</span>';const delta=Number(current)-Number(previous);if(!Number.isFinite(delta))return '<span class="metric-compare muted">'+missing+'</span>';const digits=Math.abs(delta)%1>0?1:0,arrow=delta>0?'↑':delta<0?'↓':'→',positive=delta===0?'stable':((delta>0)!==inverse?'positive':'negative');return '<span class="metric-compare '+positive+'">'+arrow+' '+formatMetric(Math.abs(delta),digits)+suffix+'</span>'}
function dashboardKpi(label,value,note,current=null,previous=null,suffix='',inverse=false,missing='Noch kein vorheriger Vergleichszeitraum'){const comparison=current===null||current===undefined?'<span class="metric-compare muted">'+missing+'</span>':metricChange(current,previous,suffix,inverse,missing);return '<section class="card dashboard-kpi"><div class="stat-label">'+label+'</div><div class="stat-value">'+value+'</div><div class="stat-note">'+note+'</div>'+comparison+'</section>'}
function getActiveCommunity(){const end=localToday(),start=dateDaysAgo(ACTIVE_COMMUNITY_DAYS-1),previousStart=dateDaysAgo(ACTIVE_COMMUNITY_DAYS*2-1),previousEnd=dateDaysAgo(ACTIVE_COMMUNITY_DAYS);const countBetween=(from,to)=>new Set(getPastEvents().filter(e=>e.event_date>=from&&e.event_date<=to).flatMap(e=>getAttendanceIds(e.id))).size;return{current:countBetween(start,end),previous:countBetween(previousStart,previousEnd)}}
function getEventCommunityVisitCounts(){const counts=new Map();getPastEvents().forEach(event=>getAttendanceIds(event.id).forEach(id=>counts.set(id,(counts.get(id)||0)+1)));return counts}
function getEventCommunityIds(){return [...getEventCommunityVisitCounts().keys()]}
function getEventVisitSequence(personId){return getPastEvents().filter(event=>getAttendanceIds(event.id).includes(personId))}
function getVisitCount(personId){return getEventVisitSequence(personId).length}
function getFirstAttendedEvent(personId){return getEventVisitSequence(personId)[0]||null}
function hasRepeatOpportunity(personId){const first=getFirstAttendedEvent(personId);if(!first)return false;const past=getPastEvents(),index=past.findIndex(event=>event.id===first.id);return index>=0&&index<past.length-1}
function hasReturned(personId){return getEventVisitSequence(personId).length>=2}
function getEventCommunityFunnel(){const counts=getEventCommunityVisitCounts(),eventParticipants=counts.size,repeaters=[...counts.values()].filter(count=>count>=2).length,regulars=[...counts.values()].filter(count=>count>=REGULAR_GUEST_VISITS).length;return{eventParticipants,repeaters,regulars,repeatRate:eventParticipants?repeaters/eventParticipants*100:null,regularRate:eventParticipants?regulars/eventParticipants*100:null}}
function getFairRepeatRate(){const ids=getEventCommunityIds(),eligible=ids.filter(hasRepeatOpportunity),returned=eligible.filter(hasReturned),rate=eligible.length?returned.length/eligible.length*100:null,reason=ids.length===0?'Noch keine auswertbare Wiederkehrquote':eligible.length===0?'Noch keine Person hatte bisher eine Wiederkehrchance':null;return{communityCount:ids.length,eligibleCount:eligible.length,returnedCount:returned.length,rate,reason,trend:null,comparisonReason:'Noch kein sinnvoller Vergleichszeitraum'}}
function getAttendanceAverages(){const past=getPastEvents(),counts=past.map(event=>getAttendanceCount(event.id)),recent=counts.slice(-DASHBOARD_EVENT_WINDOW),previousCounts=counts.slice(-DASHBOARD_EVENT_WINDOW*2,-DASHBOARD_EVENT_WINDOW),average=values=>values.length?values.reduce((sum,value)=>sum+value,0)/values.length:null,current=recent.length===DASHBOARD_EVENT_WINDOW?average(recent):null,comparisonReason=past.length<DASHBOARD_EVENT_WINDOW?'Noch keine 3 vergangenen Events':past.length<DASHBOARD_EVENT_WINDOW*2?'Noch keine 6 Events für einen 3-vs.-3-Vergleich':null;return{current,previous:previousCounts.length===DASHBOARD_EVENT_WINDOW?average(previousCounts):null,recent,previousCounts,note:'Nicht abgesagte Events',comparisonReason}}
function getEventVisitorBreakdown(eventId){const event=events.find(e=>e.id===eventId);if(!event||event.status==='Abgesagt')return{attended:0,firstVisitors:0,repeatVisitors:0,firstIds:[],repeatIds:[],ids:[]};const ids=getAttendanceIds(eventId),past=getPastEvents(),index=past.findIndex(candidate=>candidate.id===eventId),prior=new Set((index>=0?past.slice(0,index):past.filter(candidate=>candidate.event_date<event.event_date)).flatMap(candidate=>getAttendanceIds(candidate.id))),firstIds=ids.filter(id=>!prior.has(id)),repeatIds=ids.filter(id=>prior.has(id));return{attended:ids.length,firstVisitors:firstIds.length,repeatVisitors:repeatIds.length,firstIds,repeatIds,ids}}
function getUnattributedEventCustomers(){const attendedIds=new Set(getPastEvents().flatMap(event=>getAttendanceIds(event.id)));return people.filter(person=>customerStatus(person)==='through_event'&&!attendedIds.has(person.id))}
function eventConversion(eid){const breakdown=getEventVisitorBreakdown(eid),eligibleIds=breakdown.firstIds.filter(id=>customerStatus(getPerson(id))!=='before_event'),newCustomers=eligibleIds.filter(id=>customerStatus(getPerson(id))==='through_event').length;return{firstVisitors:breakdown.firstVisitors,newPeople:eligibleIds.length,possibleNewPeople:eligibleIds.length,excludedExisting:breakdown.firstIds.length-eligibleIds.length,newCustomers,repeatVisitors:breakdown.repeatVisitors,rate:eligibleIds.length?newCustomers/eligibleIds.length*100:null}}
function getEventConversionSummary(eventList=getPastEvents()){const rows=eventList.map(event=>({...eventConversion(event.id),event})),newPeople=rows.reduce((sum,row)=>sum+row.newPeople,0),newCustomers=rows.reduce((sum,row)=>sum+row.newCustomers,0),possibleNewPeople=rows.reduce((sum,row)=>sum+row.possibleNewPeople,0);return{rows,newPeople,newCustomers,possibleNewPeople,rate:possibleNewPeople?newCustomers/possibleNewPeople*100:null}}
function getCustomerBreakdown(){const communityIds=new Set(getEventCommunityIds()),members=people.filter(person=>communityIds.has(person.id));let already=0,throughEvent=0,none=0;members.forEach(person=>{const status=customerStatus(person);if(status==='before_event')already++;else if(status==='through_event')throughEvent++;else none++});return{already,throughEvent,none,total:already+throughEvent,communityCount:members.length,communityIds:[...communityIds]}}
function compareEvents(last,previous){if(!last)return null;const lastStats=evStats(last.id),previousStats=previous?evStats(previous.id):null,lastBreakdown=getEventVisitorBreakdown(last.id),previousBreakdown=previous?getEventVisitorBreakdown(previous.id):null;return{last,previous,lastStats,previousStats,lastBreakdown,previousBreakdown}}
function dashboardComparisonRow(label,current,previous,inverse=false){return '<div class="dashboard-driver"><span>'+label+'</span><span><strong>'+formatMetric(current)+'</strong>'+(previous===null||previous===undefined?'':' <small>vs. '+formatMetric(previous)+'</small>')+'</span>'+metricChange(current,previous,'',inverse)+'</div>'}
function renderAttendanceTrend(past){const trend=past.slice(-8),counts=trend.map(event=>getAttendanceCount(event.id)),max=Math.max(1,...counts),width=760,height=220,pad=34,step=trend.length>1?(width-pad*2)/(trend.length-1):0,points=counts.map((count,index)=>pad+index*step+','+(height-pad-(count/max)*(height-pad*2))).join(' ');if(!trend.length)return '<div class="empty">Noch keine vergangenen Events.</div>';return '<svg class="attendance-chart" viewBox="0 0 '+width+' '+height+'" role="img" aria-label="Teilnehmerentwicklung"><defs><linearGradient id="dashboardChartLine" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient></defs><line x1="'+pad+'" y1="'+(height-pad)+'" x2="'+(width-pad)+'" y2="'+(height-pad)+'" stroke="#dbe4f2" stroke-width="2"/><polyline points="'+points+'" fill="none" stroke="url(#dashboardChartLine)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>'+counts.map((count,index)=>{const x=pad+index*step,y=height-pad-(count/max)*(height-pad*2);return '<circle cx="'+x+'" cy="'+y+'" r="8" fill="#fff" stroke="#4f46e5" stroke-width="4"><title>'+esc(trend[index].title)+': '+count+' Teilnehmer</title></circle><text x="'+x+'" y="'+(height-10)+'" text-anchor="middle" fill="#64748b" font-size="11">'+esc(fmt(trend[index].event_date).slice(0,5))+'</text><text x="'+x+'" y="'+(y-14)+'" text-anchor="middle" fill="#172554" font-size="12" font-weight="700">'+count+'</text>'}).join('')+'</svg><div class="dashboard-trend-list">'+trend.map(event=>'<button class="trend-row" onclick="openEventDetail(\''+event.id+'\')"><span class="trend-name">'+esc(event.title)+' <span class="meta">'+fmt(event.event_date)+'</span></span><span class="trend-bar"><span style="width:'+Math.round(getAttendanceCount(event.id)/max*100)+'%"></span></span><strong>'+getAttendanceCount(event.id)+'</strong></button>').join('')+'</div>'}
function nextEventCard(next){if(!next)return '<section class="card dashboard-next"><h3 class="section-title">📅 Nächstes Event</h3><div class="empty">Noch kein Event geplant.</div></section>';const rows=evParts(next.id),yes=rows.filter(row=>row.response==='yes').length,open=rows.filter(row=>!row.response||row.response==='none').length,no=rows.filter(row=>row.response==='no').length,past=getPastEvents(),historyYes=past.reduce((sum,event)=>sum+evStats(event.id).yes,0),historyAttended=past.reduce((sum,event)=>sum+evStats(event.id).attended,0),reliability=historyYes?historyAttended/historyYes*100:null,expected=reliability===null?null:Math.round(yes*reliability/100),days=Math.max(0,dateDistance(localToday(),next.event_date));return '<section class="card dashboard-next"><div class="page-head" style="margin-bottom:10px"><div><h3 class="section-title">📅 Nächstes Event</h3><div class="meta">'+(days===0?'Heute':'noch '+days+' Tage')+'</div></div><span class="badge new">'+esc(next.status||'Geplant')+'</span></div><button class="dashboard-next-title" onclick="openEventDetail(\''+next.id+'\')"><strong>'+esc(next.title)+'</strong><span>'+fmt(next.event_date)+'</span></button><div class="next-counts"><span><strong>'+yes+'</strong> Zusagen</span><span><strong>'+open+'</strong> offen</span><span><strong>'+no+'</strong> Absagen</span></div>'+(reliability===null?'<p class="meta">Noch keine historische Zuverlässigkeit berechenbar.</p>':'<p class="meta">Historische Zusagen-Zuverlässigkeit: '+formatMetric(reliability,0)+' % · ≈ '+expected+' erwartbare Teilnehmer</p>')+'<button class="btn secondary" onclick="openEventDetail(\''+next.id+'\')">Event öffnen</button></section>'}
function dashboardWhy(compare){if(!compare||!compare.previous)return '<section class="card dashboard-why"><h3 class="section-title">Warum geht es hoch oder runter?</h3><div class="empty">Sobald zwei vergangene Events vorliegen, werden Erstbesucher, Wiederkehrer, Zusagen und No-Shows verglichen.</div></section>';const last=compare.last,previous=compare.previous,lastStats=compare.lastStats,previousStats=compare.previousStats,lastBreakdown=compare.lastBreakdown,previousBreakdown=compare.previousBreakdown;return '<section class="card dashboard-why"><div class="page-head" style="margin-bottom:10px"><div><h3 class="section-title">Warum geht es hoch oder runter?</h3><div class="meta">'+esc(last.title)+' gegenüber '+esc(previous.title)+'</div></div><span class="badge '+(lastBreakdown.attended-(previousBreakdown?.attended||0)>=0?'new':'no-show')+'">'+metricChange(lastBreakdown.attended,previousBreakdown?.attended??null,' Teilnehmer',true)+'</span></div><div class="dashboard-drivers">'+dashboardComparisonRow('Erstbesucher',lastBreakdown.firstVisitors,previousBreakdown?.firstVisitors??null)+dashboardComparisonRow('Wiederkehrer',lastBreakdown.repeatVisitors,previousBreakdown?.repeatVisitors??null)+dashboardComparisonRow('Zusagen',lastStats.yes,previousStats?.yes??null,true)+dashboardComparisonRow('No-Shows',lastStats.noShows,previousStats?.noShows??null,true)+'</div></section>'}
function getDashboardActions(next,last){const actions=[];if(next){const unanswered=evParts(next.id).filter(row=>!row.response||row.response==='none').length;if(unanswered)actions.push({title:unanswered+' Personen haben beim nächsten Event noch nicht geantwortet',detail:next.title,action:'openEventDetail(\''+next.id+'\')'})}const followUp=people.filter(person=>{const history=getAttendedEventRows(person.id);return history.length===1&&dateDistance(history[0].e.event_date,localToday())>=SECOND_VISIT_FOLLOWUP_DAYS});if(followUp.length)actions.push({title:followUp.length+' Erstbesucher hatten noch keinen zweiten Besuch',detail:'Seit mindestens '+SECOND_VISIT_FOLLOWUP_DAYS+' Tagen offen',action:"go('people')" });const staleRegulars=people.filter(person=>{if(getVisitCount(person.id)<REGULAR_GUEST_VISITS)return false;const lastVisit=lastAttendedEvent(person.id);return lastVisit&&dateDistance(lastVisit.event_date,localToday())>=ACTIVE_COMMUNITY_DAYS});if(staleRegulars.length)actions.push({title:staleRegulars.length+' Stammgäste wurden seit '+ACTIVE_COMMUNITY_DAYS+' Tagen nicht gesehen',detail:'Wiedereinladung prüfen',action:"go('people')" });if(last){const noShows=evStats(last.id).noShows;if(noShows)actions.push({title:noShows+' Zusagen sind beim letzten Event nicht erschienen',detail:last.title,action:'openEventDetail(\''+last.id+'\')'})}return actions.slice(0,5)}

function conversionKpiNote(summary){return summary.possibleNewPeople?summary.newCustomers+' von '+summary.possibleNewPeople+' möglichen Neukunden gewonnen':'Noch keine auswertbaren Neukunden'}
function conversionOverview(){const summary=getEventConversionSummary(),customer=getCustomerBreakdown(),quality=getUnattributedEventCustomers(),conversionRows=summary.rows.filter(row=>row.possibleNewPeople).slice(-5).reverse();return '<section class="card dashboard-conversion"><div class="page-head" style="margin-bottom:10px"><div><h3 class="section-title">Event-Conversion</h3><div class="meta">Bereits bestehende Kunden werden aus Zähler und Nenner ausgeschlossen.</div></div><span class="badge customer">'+(summary.rate===null?'–':formatMetric(summary.rate,0)+' %')+'</span></div><div class="dashboard-mini-grid"><div><span>Mögliche Neukunden</span><strong>'+summary.possibleNewPeople+'</strong></div><div><span>Kunden durch Events</span><strong>'+summary.newCustomers+'</strong></div><div><span>Bereits Kunde</span><strong>'+customer.already+'</strong></div><div><span>Kunden gesamt</span><strong>'+customer.total+'</strong></div></div>'+(summary.possibleNewPeople?'<div class="meta" style="margin-top:10px">'+summary.newCustomers+' von '+summary.possibleNewPeople+' möglichen Neukunden gewonnen.</div>':'<div class="empty">Noch keine auswertbaren Neukunden.</div>')+(conversionRows.length?'<div class="dashboard-conversion-list">'+conversionRows.map(row=>'<button class="trend-row" onclick="openEventDetail(\''+row.event.id+'\')"><span class="trend-name">'+esc(row.event.title)+' <span class="meta">'+fmt(row.event.event_date)+'</span></span><span class="meta">'+row.newCustomers+' von '+row.possibleNewPeople+' möglichen Neukunden</span><strong>'+formatMetric(row.rate,0)+'%</strong></button>').join('')+'</div>':'')+(quality.length?'<div class="meta" style="margin-top:10px">'+quality.length+' '+(quality.length===1?'Kunde ist':'Kunden sind')+' als „durch Event gewonnen“ markiert, aber ohne zuordenbare vergangene Eventteilnahme.</div>':'')+'</section>'}

function normalizeContactName(value){const raw=String(value??'').toLowerCase().trim(),comma=raw.includes(','),mapped=raw.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss'),tokens=mapped.replace(/[.,;:/|_\-]+/g,' ').replace(/[^a-z0-9 ]+/g,' ').split(/\s+/).filter(Boolean);if(comma)tokens.reverse();return tokens.sort().join(' ')}
function contactNameSimilarity(left,right){const a=normalizeContactName(left),b=normalizeContactName(right);if(!a||!b)return 0;if(a===b)return 1;const distance=(x,y)=>{const row=Array.from({length:y.length+1},(_,i)=>i);for(let i=1;i<=x.length;i++){let diagonal=row[0];row[0]=i;for(let j=1;j<=y.length;j++){const above=row[j],cost=x[i-1]===y[j-1]?0:1;row[j]=Math.min(row[j]+1,row[j-1]+1,diagonal+cost);diagonal=above}}return row[y.length]};const full=1-distance(a,b)/Math.max(a.length,b.length);const at=a.split(' '),bt=b.split(' '),token=at.reduce((sum,word)=>sum+Math.max(...bt.map(other=>1-distance(word,other)/Math.max(word.length,other.length))),0)/Math.max(at.length,1);return Math.max(0,Math.min(1,Math.max(full,token*.92)))}

async function linkPotentialToPerson(contactId,personId){if(!isAdmin())return;const contact=potentialContacts.find(item=>item.id===contactId),person=getPerson(personId);if(!contact||!person)return;if(contact.linked_person_id===personId)return alert('Dieser Eventkontakt ist bereits verknüpft.');const existing=getPotentialLinksForPerson(personId,contactId),warning=existing.length?`Hinweis: „${person.name}“ ist bereits mit ${existing.length} anderem Potential-Kontakt verknüpft (${existing.map(item=>item.name).join(', ')}). Diese Verknüpfung bleibt bestehen.\n\n`:'';if(!confirm(`„${contact.name}“ mit dem Eventkontakt „${person.name}“ verknüpfen?\n\n${warning}Es werden keine Daten zusammengeführt, überschrieben oder gelöscht.`))return;setLoading(true);const {data,error}=await sb.from('potential_contacts').update({linked_person_id:personId}).eq('id',contactId).eq('owner_user_id',session.user.id).select('id');setLoading(false);if(error)return alert(error.message||'Die Verknüpfung konnte nicht gespeichert werden.');if(!data?.length)return alert('Die Verknüpfung konnte nicht gespeichert werden.');potentialLinkSearchOpen=false;potentialLinkSearch='';await loadAll()}

async function savePotentialEventContactReady(contactId){if(!isAdmin())return;const contact=potentialContacts.find(item=>item.id===contactId);if(!contact||!contact.linked_person_id)return;const ready=Boolean(document.getElementById('readyViaEventContact')?.checked),values={ready_via_event_contact:ready,ready_via_event_contact_at:ready?new Date().toISOString():null};setLoading(true);const {data,error}=await sb.from('potential_contacts').update(values).eq('id',contactId).eq('owner_user_id',session.user.id).select('id');setLoading(false);if(error)return alert(error.message||'Die Event-Terminierbarkeit konnte nicht gespeichert werden.');if(!data?.length)return alert('Die Event-Terminierbarkeit konnte nicht gespeichert werden.');await loadAll()}
async function savePotentialDetail(){const c=potentialContacts.find(x=>x.id===selectedPersonId);if(!c||!isAdmin())return;const value=id=>document.getElementById(id)?.value??'',checked=id=>Boolean(document.getElementById(id)?.checked),optionalBool=id=>{const raw=value(id);return raw===''?null:raw==='true'},values={name:value('potentialName').trim(),sociotope:value('potentialSociotope').trim()||null,focus_status:value('potentialFocusStatus')||c.focus_status,focus_age:value('focusAge').trim()||null,focus_profession_detail:value('focusProfession').trim()||null,focus_late_call_reaction:document.getElementById('focusLateCall')?value('focusLateCall').trim()||null:c.focus_late_call_reaction||null,focus_near_office:optionalBool('focusNearOffice'),focus_rooted_area:optionalBool('focusRooted'),focus_reason:value('focusReason').trim()||null,focus_notes:value('focusNotes').trim()||null,focus_next_step:value('focusNextStep').trim()||null,focus_follow_up_date:value('focusFollowUp')||null,current_status:value('focusStatus')||'Offen',first_meeting_done:checked('firstMeeting'),second_meeting_done:checked('secondMeeting'),elevator_pitch_done:checked('elevatorPitch'),contact_trust:value('contactTrust').trim()||null,elevator_pitch_reaction:value('pitchReaction').trim()||null};PARTNER_FIELDS.concat(CUSTOMER_FIELDS,APPROACH_FIELDS).forEach(([key])=>values[key]=checked(key));const hasPositive=POTENTIAL_POSITIVE.some(key=>Boolean(values[key])),requestedStatus=value('potentialFocusStatus')||c.focus_status;values.focus_status=hasPositive?'focus':requestedStatus==='completed'?'completed':'none';if(!values.name)return alert('Bitte einen Namen eingeben.');setLoading(true);const {data,error}=await sb.from('potential_contacts').update(values).eq('id',c.id).eq('owner_user_id',session.user.id).select('id');setLoading(false);if(error)return alert(error.message||'Kontakt konnte nicht gespeichert werden.');if(!data?.length)return alert('Kontakt konnte nicht gespeichert werden.');modal=null;await loadAl function renderAttendanceChart(){if(route!=='dashboard')return;const heading=[...document.querySelectorAll('.section-title')].find(x=>x.textContent.includes('Teilnehmer der letzten Events'));const card=heading?.closest('.card');if(!card)return;const past=events.filter(e=>e.event_date<localToday()&&e.status!=='Abgesagt').sort((a,b)=>a.event_date.localeCompare(b.event_date)).slice(-8),counts=past.map(e=>evStats(e.id).attended),max=Math.max(1,...counts),w=760,h=230,pad=34,step=past.length>1?(w-pad*2)/(past.length-1):0,points=counts.map((v,i)=>`${pad+i*step},${h-pad-(v/max)*(h-pad*2)}`).join(' ');card.innerHTML=`<div class="chart-head"><div><h3 class="section-title">📈 Teilnehmerentwicklung</h3><div class="meta">Teilgenommene Personen pro vergangenem Event</div></div><span class="badge new">${counts.length} Events</span></div>${past.length?`<svg class="attendance-chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Teilnehmerentwicklung"><defs><linearGradient id="chartLine" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#4f46e5"/></linearGradient></defs><line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#dbe4f2" stroke-width="2"/><polyline points="${points}" fill="none" stroke="url(#chartLine)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>${counts.map((v,i)=>{const x=pad+i*step,y=h-pad-(v/max)*(h-pad*2);return `<circle cx="${x}" cy="${y}" r="8" fill="#fff" stroke="#4f46e5" stroke-width="4"><title>${esc(past[i].title)}: ${v} Teilnehmer</title></circle><text x="${x}" y="${h-10}" text-anchor="middle" fill="#64748b" font-size="11">${esc(fmt(past[i].event_date).slice(0,5))}</text><text x="${x}" y="${y-14}" text-anchor="middle" fill="#172554" font-size="12" font-weight="700">${v}</text>`}).join('')}</svg>`:'<div class="empty">Noch keine vergangenen Events.</div>'}`}
