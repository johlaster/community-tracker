<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <title>Community Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#f5f7fb;--surface:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--primary:#111827;--soft:#eef0f4;--success:#12805c;--success-soft:#e8f7f1;--blue:#2563eb;--blue-soft:#eff6ff;--gold:#9a6700;--gold-soft:#fff8db;--danger:#c2413b;--danger-soft:#fff0ef;--radius:18px;--shadow:0 12px 30px rgba(15,23,42,.07)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .topbar{position:sticky;top:0;z-index:10;background:rgba(245,247,251,.93);backdrop-filter:blur(14px);border-bottom:1px solid rgba(229,231,235,.8)}.topbar-inner{max-width:1120px;margin:auto;min-height:68px;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--primary);color:white;font-size:20px;box-shadow:var(--shadow)}.brand h1{font-size:18px;margin:0}.brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
    .container{max-width:1120px;margin:auto;padding:24px 18px 100px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}.page-head h2{margin:0;font-size:clamp(24px,4vw,34px);letter-spacing:-.04em}.page-head p{color:var(--muted);margin:6px 0 0}.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800}
    .grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.two-col{grid-template-columns:1.2fr .8fr}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.stat-label{color:var(--muted);font-size:13px}.stat-value{font-size:29px;font-weight:750;margin-top:8px;letter-spacing:-.04em}.stat-note{color:var(--muted);font-size:12px;margin-top:4px}.section-title{margin:0 0 14px;font-size:17px}.list{display:grid;gap:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.person-name{font-weight:700}.meta{color:var(--muted);font-size:13px;margin-top:3px}.badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}.badge{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:650;white-space:nowrap;background:var(--soft)}.badge.first{color:var(--success);background:var(--success-soft)}.badge.new{color:var(--blue);background:var(--blue-soft)}.badge.regular{color:var(--gold);background:var(--gold-soft)}.badge.customer{color:#6d28d9;background:#f4efff}.badge.no-show{color:var(--danger);background:var(--danger-soft)}
    .btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700;background:var(--primary);color:white}.btn.secondary{background:white;color:var(--text);border:1px solid var(--line)}.btn.ghost{background:transparent;color:var(--text);padding:8px 10px}.btn.danger{background:var(--danger)}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.input,select,textarea{width:100%;background:white;border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:var(--text);outline:none}.search{flex:1;min-width:210px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;margin-bottom:6px;font-size:13px;font-weight:700}.field.full{grid-column:1/-1}
    .nav{position:fixed;z-index:20;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:0 16px 36px rgba(15,23,42,.16);border-radius:18px;padding:6px}.nav button{width:92px;border:0;background:transparent;padding:9px 8px;border-radius:13px;color:var(--muted);font-size:12px;font-weight:700}.nav button span{display:block;font-size:19px;margin-bottom:2px}.nav button.active{background:var(--primary);color:white}
    .modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.46);display:grid;place-items:end center;padding:16px}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:white;border-radius:22px;box-shadow:0 24px 70px rgba(15,23,42,.25);padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h3{margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.empty{color:var(--muted);text-align:center;padding:32px 10px}.check{width:27px;height:27px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;background:white;color:white;flex:0 0 auto}.check.checked{background:var(--success);border-color:var(--success)}.rsvp{display:flex;gap:5px}.rsvp button{border:1px solid var(--line);background:white;padding:7px 9px;border-radius:9px;font-size:12px;font-weight:700}.rsvp button.active.yes{background:var(--success-soft);color:var(--success)}.rsvp button.active.no{background:var(--danger-soft);color:var(--danger)}
    .hero{padding:22px;background:linear-gradient(135deg,#111827,#334155);color:white;border:0}.hero .meta{color:rgba(255,255,255,.72)}.hero-number{font-size:44px;font-weight:800;letter-spacing:-.05em;margin:10px 0 2px}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(470px,100%)}.login-card h1{margin:0 0 8px}.notice{padding:12px 14px;border-radius:12px;background:var(--blue-soft);color:#1e40af;font-size:13px;line-height:1.5;margin:14px 0}.error{background:var(--danger-soft);color:var(--danger)}.success{background:var(--success-soft);color:var(--success)}.small{font-size:12px;color:var(--muted);line-height:1.5}.loading{position:fixed;inset:0;z-index:100;background:rgba(245,247,251,.75);backdrop-filter:blur(3px);display:grid;place-items:center;font-weight:800}
    @media(max-width:820px){.stats{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}}@media(max-width:560px){.container{padding:18px 12px 92px}.topbar-inner{padding:10px 12px}.stats{gap:10px}.card{padding:15px;border-radius:16px}.stat-value{font-size:24px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.nav{bottom:8px;width:calc(100% - 16px);justify-content:space-around}.nav button{width:auto;flex:1;padding:8px 4px}.row{align-items:flex-start}}
  </style>
</head>
<body>
<div id="app"></div><div id="loading" class="loading hidden">Wird geladen …</div>
<script>
const CONFIG_KEY='ct-supabase-config-v1';
const DEFAULT_CONFIG={url:'https://bzzruvkmwaekxxzrmywv.supabase.co',key:'sb_publishable_TCOoaED0wEn82aCGweE1-Q_ICzKG-Ks'};
let sb=null, session=null, route='dashboard', modal=null, selectedEventId=null, search='';
let recoveryMode=location.hash.includes('type=recovery');
let people=[], events=[], participations=[];
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const fmt=d=>new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d+'T12:00:00'));
function cfg(){try{return JSON.parse(localStorage.getItem(CONFIG_KEY))||DEFAULT_CONFIG}catch{return DEFAULT_CONFIG}}
function setLoading(v){$('#loading')?.classList.toggle('hidden',!v)}
function notice(msg,type='notice'){return `<div class="notice ${type}">${esc(msg)}</div>`}
async function init(){const c=cfg(); if(!c?.url||!c?.key){renderSetup();return} try{sb=supabase.createClient(c.url,c.key); const {data}=await sb.auth.getSession(); session=data.session; sb.auth.onAuthStateChange((event,s)=>{session=s;if(event==='PASSWORD_RECOVERY')recoveryMode=true;if(recoveryMode){renderPasswordRecovery();return}if(session)loadAll();else renderLogin()}); if(recoveryMode)renderPasswordRecovery();else if(session)await loadAll();else renderLogin()}catch(e){renderSetup('Verbindung fehlgeschlagen: '+e.message)}}
function renderSetup(err=''){document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="card login-card"><div class="logo">🎮</div><h1 style="margin-top:16px">Community Tracker verbinden</h1><p class="meta">Einmalig die beiden öffentlichen Supabase-Werte eintragen. Auf deinem zweiten Gerät machst du das ebenfalls einmal.</p>${err?notice(err,'error'):''}<div class="field"><label>Project URL</label><input id="setupUrl" class="input" placeholder="https://…supabase.co"></div><div class="field" style="margin-top:12px"><label>Publishable Key</label><textarea id="setupKey" rows="4" placeholder="sb_publishable_…"></textarea></div><button class="btn" style="width:100%;margin-top:16px" onclick="saveSetup()">Verbinden</button><p class="small">Die Werte findest du in Supabase über „Connect“. Der Publishable Key darf in einer Browser-App verwendet werden. Niemals den Service-Role-Key eintragen.</p></div></div>`}
function saveSetup(){const url=$('#setupUrl').value.trim(),key=$('#setupKey').value.trim();if(!url||!key)return;localStorage.setItem(CONFIG_KEY,JSON.stringify({url,key}));location.reload()}
function renderLogin(msg=''){document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="card login-card"><div class="logo">🎮</div><h1 style="margin-top:16px">Community Tracker</h1><p class="meta">Mit demselben Konto am Hauptrechner und Laptop anmelden.</p>${msg?notice(msg):''}<div class="field"><label>E-Mail</label><input id="email" class="input" type="email"></div><div class="field" style="margin-top:12px"><label>Passwort</label><input id="password" class="input" type="password"></div><button class="btn" style="width:100%;margin-top:16px" onclick="login()">Anmelden</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="signup()">Konto anlegen</button><button class="btn ghost" style="width:100%;margin-top:6px" onclick="requestPasswordReset()">Passwort vergessen?</button><button class="btn ghost" style="width:100%;margin-top:6px" onclick="resetConfig()">Supabase-Verbindung ändern</button><div id="loginMsg"></div></div></div>`}
async function login(){setLoading(true);const {error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});setLoading(false);if(error)$('#loginMsg').innerHTML=notice(error.message,'error')}
async function signup(){setLoading(true);const {error}=await sb.auth.signUp({email:$('#email').value.trim(),password:$('#password').value});setLoading(false);$('#loginMsg').innerHTML=error?notice(error.message,'error'):notice('Konto angelegt. Prüfe gegebenenfalls deine E-Mails und bestätige die Anmeldung.','success')}
async function requestPasswordReset(){const email=$('#email').value.trim();if(!email){$('#loginMsg').innerHTML=notice('Bitte zuerst deine E-Mail-Adresse eingeben.','error');return}setLoading(true);const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});setLoading(false);$('#loginMsg').innerHTML=error?notice(error.message,'error'):notice('Falls für diese Adresse ein Konto besteht, bekommst du einen Link zum Zurücksetzen.','success')}
function renderPasswordRecovery(){document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="card login-card"><div class="logo">🎮</div><h1 style="margin-top:16px">Neues Passwort setzen</h1><p class="meta">Wähle ein neues Passwort für deinen Community Tracker.</p><div class="field" style="margin-top:16px"><label>Neues Passwort</label><input id="newPassword" class="input" type="password" autocomplete="new-password"></div><div class="field" style="margin-top:12px"><label>Passwort wiederholen</label><input id="confirmPassword" class="input" type="password" autocomplete="new-password"></div><button class="btn" style="width:100%;margin-top:16px" onclick="saveNewPassword()">Passwort speichern</button><div id="recoveryMsg"></div></div></div>`}
async function saveNewPassword(){const password=$('#newPassword').value,confirm=$('#confirmPassword').value;if(password.length<8){$('#recoveryMsg').innerHTML=notice('Das Passwort muss mindestens 8 Zeichen haben.','error');return}if(password!==confirm){$('#recoveryMsg').innerHTML=notice('Die Passwörter stimmen nicht überein.','error');return}setLoading(true);const {error}=await sb.auth.updateUser({password});setLoading(false);if(error){$('#recoveryMsg').innerHTML=notice(error.message,'error');return}recoveryMode=false;history.replaceState(null,'',location.pathname);await loadAll()}
async function logout(){await sb.auth.signOut()}
function resetConfig(){localStorage.removeItem(CONFIG_KEY);location.reload()}
async function loadAll(){setLoading(true);const [p,e,a]=await Promise.all([sb.from('persons').select('*').order('name'),sb.from('events').select('*').order('event_date',{ascending:false}),sb.from('participations').select('*')]);setLoading(false);const err=p.error||e.error||a.error;if(err){document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="card login-card"><h1>Daten konnten nicht geladen werden</h1>${notice(err.message,'error')}<p class="small">Meist fehlen noch API-Berechtigungen oder die Sicherheitseinstellungen.</p><button class="btn secondary" onclick="logout()">Abmelden</button></div></div>`;return}people=p.data||[];events=e.data||[];participations=a.data||[];render()}
function visits(id){return participations.filter(a=>a.person_id===id&&a.attended).length}function status(id){const v=visits(id);return v<=1?['Erstbesuch','first','🟢']:v===2?['Neu','new','🔵']:['Stammgast','regular','⭐']}function evParts(id){return participations.filter(a=>a.event_id===id)}function evStats(id){const r=evParts(id);return{yes:r.filter(x=>x.response==='yes').length,attended:r.filter(x=>x.attended).length,noShows:r.filter(x=>x.response==='yes'&&!x.attended).length,total:r.length}}function getPerson(id){return people.find(p=>p.id===id)}
function layout(content){return `<header class="topbar"><div class="topbar-inner"><div class="brand"><div class="logo">🎮</div><div><h1>Community Tracker</h1><p>${esc(session?.user?.email||'')}</p></div></div><div style="display:flex;gap:8px"><button class="btn" onclick="openEvent()">+ Event</button><button class="btn secondary" onclick="logout()">Abmelden</button></div></div></header><main class="container">${content}</main><nav class="nav">${nav('dashboard','⌂','Dashboard')}${nav('events','◫','Events')}${nav('people','♙','Personen')}</nav>${renderModal()}`}
function nav(r,i,l){return `<button class="${route===r?'active':''}" onclick="go('${r}')"><span>${i}</span>${l}</button>`}function go(r){route=r;selectedEventId=null;render()}
function render(){let c=route==='dashboard'?dashboard():route==='events'?eventsPage():route==='people'?peoplePage():eventDetail();document.getElementById('app').innerHTML=layout(c)}
function dashboard(){const now=new Date();const today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;const past=events.filter(e=>e.event_date<today);const next=[...events].filter(e=>e.event_date>=today).sort((a,b)=>a.event_date.localeCompare(b.event_date))[0];const last=[...events].filter(e=>e.event_date<today).sort((a,b)=>b.event_date.localeCompare(a.event_date))[0];const s=last?evStats(last.id):{yes:0,attended:0,noShows:0};const regulars=people.filter(p=>visits(p.id)>=3).length,customers=people.filter(p=>p.customer).length,reliability=s.yes?Math.round(s.attended/s.yes*100):0;const average=past.length?(participations.filter(a=>a.attended&&past.some(e=>e.id===a.event_id)).length/past.length).toFixed(1).replace('.',','):'0';const refs=people.map(p=>({...p,count:participations.filter(a=>a.brought_by===p.id).length})).filter(p=>p.count).sort((a,b)=>b.count-a.count);return `<div class="page-head"><div><div class="kicker">Überblick</div><h2>Deine Community</h2><p>Live-Daten aus Supabase.</p></div></div><div class="grid stats">${stat('Personen',people.length,`${people.filter(p=>visits(p.id)>0).length} waren bereits dabei`)}${stat('Events',events.length,'Insgesamt geplant')}${stat('Kunden',customers,`${regulars} Stammgäste`)}${stat('Ø Teilnehmer',average,'Pro Event')}</div><div class="grid two-col" style="margin-top:16px"><section class="card"><h3 class="section-title">📅 Nächstes Event</h3>${next?`<div class="person-name">${esc(next.title)}</div><div class="meta">${fmt(next.event_date)} · ${evStats(next.id).yes} Zusagen</div>`:'<div class="empty">Noch kein Event geplant.</div>'}</section><section class="card"><h3 class="section-title">🏁 Letztes Event</h3>${last?`<div class="person-name">${esc(last.title)}</div><div class="meta">${fmt(last.event_date)} · ${s.attended} Teilnehmer</div>`:'<div class="empty">Noch kein vergangenes Event.</div>'}</section></div><div class="grid two-col" style="margin-top:16px"><section class="card hero"><div class="kicker" style="color:#ffffffaa">Zuverlässigkeit letztes Event</div><div class="hero-number">${reliability} %</div><div class="meta">${s.attended} von ${s.yes} Zusagen sind gekommen.</div></section><section class="card"><h3 class="section-title">🏆 Top-Zuträger</h3>${refs.length?refs.slice(0,5).map((p,i)=>`<div class="row"><div><div class="person-name">${i+1}. ${esc(p.name)}</div><div class="meta">${p.count} Personen mitgebracht</div></div><span class="badge">${p.count}</span></div>`).join(''):'<div class="empty">Noch keine Empfehlungen erfasst.</div>'}</section></div>`}
function stat(l,v,n){return `<div class="card"><div class="stat-label">${l}</div><div class="stat-value">${v}</div><div class="stat-note">${n}</div></div>`}
function peoplePage(){const arr=people.filter(p=>p.name.toLowerCase().includes(search.toLowerCase()));return `<div class="page-head"><div><div class="kicker">Community</div><h2>Personen</h2><p>${people.length} Personen insgesamt</p></div><button class="btn" onclick="openPerson()">+ Person</button></div><div class="toolbar"><input class="input search" placeholder="Name suchen …" value="${esc(search)}" oninput="search=this.value;render()"></div><section class="card">${arr.length?arr.map(personRow).join(''):'<div class="empty">Noch keine Personen.</div>'}</section>`}
function personRow(p){const st=status(p.id);return `<div class="row"><div><div class="person-name">${esc(p.name)}</div><div class="meta">${visits(p.id)} Besuche</div></div><div class="badges"><span class="badge ${st[1]}">${st[2]} ${st[0]}</span>${p.customer?'<span class="badge customer">💼 Kunde</span>':''}<button class="btn ghost" onclick="toggleCustomer('${p.id}',${!p.customer})">${p.customer?'Kein Kunde':'Als Kunde'}</button></div></div>`}
function eventsPage(){return `<div class="page-head"><div><div class="kicker">Veranstaltungen</div><h2>Events</h2><p>Zusagen und Teilnehmer verwalten.</p></div><button class="btn" onclick="openEvent()">+ Event</button></div><section class="card">${events.length?events.map(e=>{const s=evStats(e.id);return `<div class="row" onclick="openEventDetail('${e.id}')" style="cursor:pointer"><div><div class="person-name">${esc(e.title)}</div><div class="meta">${fmt(e.event_date)} · ${s.yes} Zusagen · ${s.attended} Teilnehmer</div></div><span>›</span></div>`}).join(''):'<div class="empty">Noch keine Events.</div>'}</section>`}
function openEventDetail(id){selectedEventId=id;route='event';render()}
function eventDetail(){const e=events.find(x=>x.id===selectedEventId);if(!e)return eventsPage();const rows=evParts(e.id).map(a=>({a,p:getPerson(a.person_id)})).filter(x=>x.p).sort((x,y)=>x.p.name.localeCompare(y.p.name));const s=evStats(e.id);return `<div class="page-head"><div><div class="kicker">${fmt(e.event_date)}</div><h2>${esc(e.title)}</h2><p>${s.yes} Zusagen · ${s.attended} Teilnehmer · ${s.noShows} No-Shows</p></div><button class="btn" onclick="openGuest('${e.id}')">+ Neuer Gast</button></div><section class="card"><h3 class="section-title">Teilnehmerverwaltung</h3>${rows.length?rows.map(({a,p})=>`<div class="row"><div><div class="person-name">${esc(p.name)}</div><div class="meta">${visits(p.id)} bisherige Besuche</div></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><div class="rsvp"><button class="${a.response==='yes'?'active yes':''}" onclick="setRsvp('${a.id}','yes')">Zusage</button><button class="${a.response==='no'?'active no':''}" onclick="setRsvp('${a.id}','no')">Absage</button><button class="${a.response==='none'?'active':''}" onclick="setRsvp('${a.id}','none')">Offen</button></div><button class="check ${a.attended?'checked':''}" onclick="setAttend('${a.id}',${!a.attended})">${a.attended?'✓':''}</button></div></div>`).join(''):'<div class="empty">Keine Personen vorhanden.</div>'}</section>`}
function openPerson(){modal='person';render()}function openEvent(){modal='event';render()}function openGuest(id){modal='guest';selectedEventId=id;render()}function closeModal(){modal=null;render()}
function renderModal(){if(!modal)return'';if(modal==='person')return modalShell('Person hinzufügen',`<div class="field"><label>Name</label><input id="pName" class="input"></div><div class="field" style="margin-top:12px"><label><input id="pCustomer" type="checkbox"> Kunde</label></div>`,`addPerson()`);if(modal==='event')return modalShell('Event erstellen',`<div class="form-grid"><div class="field"><label>Titel</label><input id="eTitle" class="input" value="Mario Kart Abend"></div><div class="field"><label>Datum</label><input id="eDate" class="input" type="date"></div><div class="field full"><label>Notiz</label><textarea id="eNotes" rows="3"></textarea></div></div>`,`addEvent()`);if(modal==='guest')return modalShell('Neuen Gast hinzufügen',`<div class="field"><label>Name</label><input id="gName" class="input"></div><div class="field" style="margin-top:12px"><label>Mitgebracht von</label><select id="gBy"><option value="">Keine Angabe</option>${people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label><input id="gCustomer" type="checkbox"> Kunde</label></div>`,`addGuest()`)}
function modalShell(title,body,save){return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="btn ghost" onclick="closeModal()">✕</button></div>${body}<div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Abbrechen</button><button class="btn" onclick="${save}">Speichern</button></div></div></div>`}
async function addPerson(){const name=$('#pName').value.trim();if(!name)return;setLoading(true);const {error}=await sb.from('persons').insert({name,customer:$('#pCustomer').checked,user_id:session.user.id});setLoading(false);if(error)return alert(error.message);modal=null;await loadAll()}
async function toggleCustomer(id,val){setLoading(true);const {error}=await sb.from('persons').update({customer:val}).eq('id',id);setLoading(false);if(error)return alert(error.message);await loadAll()}
async function addEvent(){const title=$('#eTitle').value.trim(),event_date=$('#eDate').value;if(!title||!event_date)return;setLoading(true);const {data,error}=await sb.from('events').insert({title,event_date,notes:$('#eNotes').value.trim(),user_id:session.user.id}).select().single();if(!error&&people.length){const rows=people.map(p=>({event_id:data.id,person_id:p.id,response:'none',attended:false}));const r=await sb.from('participations').insert(rows);if(r.error){setLoading(false);return alert(r.error.message)}}setLoading(false);if(error)return alert(error.message);modal=null;selectedEventId=data.id;route='event';await loadAll()}
async function addGuest(){const name=$('#gName').value.trim();if(!name)return;setLoading(true);const {data:p,error}=await sb.from('persons').insert({name,customer:$('#gCustomer').checked,user_id:session.user.id}).select().single();if(error){setLoading(false);return alert(error.message)}const r=await sb.from('participations').insert({event_id:selectedEventId,person_id:p.id,response:'none',attended:true,brought_by:$('#gBy').value||null});setLoading(false);if(r.error)return alert(r.error.message);modal=null;await loadAll()}
async function setRsvp(id,response){const {error}=await sb.from('participations').update({response}).eq('id',id);if(error)return alert(error.message);await loadAll()}
async function setAttend(id,attended){const {error}=await sb.from('participations').update({attended}).eq('id',id);if(error)return alert(error.message);await loadAll()}
init();
</script>
</body>
</html>
