<script>
const DEFAULT_CONFIG={url:'https://bzzruvkmwaekxxzrmywv.supabase.co',key:'sb_publishable_TCOoaED0wEn82aCGweE1-Q_ICzKG-Ks'};
let sb=null, session=null, route=typeof URLSearchParams==='undefined'?'dashboard':(new URLSearchParams(location.search).get('view')||'dashboard'), modal=null, selectedEventId=null, eventTemplateId=null, selectedPersonId=null, search='', eventFilter='Alle', customerFilter='Alle', potentialSociotope='Alle', potentialFocusFilter='Alle', potentialSearch='';

let people=[], events=[], participations=[], potentialContacts=[], workspaceMembers=[];
let accessRole=null, absenceDays=60, restoreData=null, restoreError='', potentialImportRows=null;
const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const isAdmin=()=>accessRole==='admin';

function readCustomerStatus(){const select=$('#pCustomerStatus')||$('#gCustomerStatus');return select?.value||($('#pCustomer')?.checked?'before_event':'none')}
const fmt=d=>new Intl.DateTimeFormat('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(d+'T12:00:00'));
const localToday=()=>{const now=new Date();return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`}

async function init(){const c=DEFAULT_CONFIG; try{sb=supabase.createClient(c.url,c.key); const {data}=await sb.auth.getSession(); session=data.session; sb.auth.onAuthStateChange((event,s)=>{session=s;if(event==='PASSWORD_RECOVERY')recoveryMode=true;if(recoveryMode){renderPasswordRecovery();return}if(session)startSession();else renderLogin()}); if(recoveryMode)renderPasswordRecovery();else if(session)await startSession();else renderLogin()}catch(e){document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="card login-card"><h1>Verbindung fehlgeschlagen</h1>${notice(e.message,'error')}<button class="btn" onclick="location.reload()">Erneut versuchen</button></div></div>`}}
function renderLogin(msg=''){document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="card login-card"><div class="logo">🎮</div><h1 style="margin-top:16px">Community Tracker</h1><p class="meta">Mit demselben Konto am Hauptrechner und Laptop anmelden.</p>${msg?notice(msg):''}<div class="field"><label>E-Mail</label><input id="email" class="input" type="email"></div><div class="field" style="margin-top:12px"><label>Passwort</label><input id="password" class="input" type="password"></div><button class="btn" style="width:100%;margin-top:16px" onclick="login()">Anmelden</button><button class="btn secondary" style="width:100%;margin-top:8px" onclick="signup()">Konto anlegen</button><button class="btn ghost" style="width:100%;margin-top:6px" onclick="requestPasswordReset()">Passwort vergessen?</button><div id="loginMsg"></div></div></div>`}

async function signup(){setLoading(true);const {error}=await sb.auth.signUp({email:$('#email').value.trim(),password:$('#password').value});setLoading(false);$('#loginMsg').innerHTML=error?notice(error.message,'error'):notice('Konto angelegt. Prüfe gegebenenfalls deine E-Mails und bestätige die Anmeldung.','success')}
async function requestPasswordReset(){const email=$('#email').value.trim();if(!email){$('#loginMsg').innerHTML=notice('Bitte zuerst deine E-Mail-Adresse eingeben.','error');return}const redirectTo=location.hostname.endsWith('github.io')?'https://johlaster.github.io/community-tracker/':location.origin+location.pathname;setLoading(true);const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});setLoading(false);$('#loginMsg').innerHTML=error?notice(error.message,'error'):notice('Falls für diese Adresse ein Konto besteht, bekommst du einen Link zum Zurücksetzen. Öffne den Link bitte im selben Browser.', 'success')}
function renderPasswordRecovery(){document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="card login-card"><div class="logo">🎮</div><h1 style="margin-top:16px">Neues Passwort setzen</h1><p class="meta">Wähle ein neues Passwort für deinen Community Tracker.</p><div class="field" style="margin-top:16px"><label>Neues Passwort</label><input id="newPassword" class="input" type="password" autocomplete="new-password"></div><div class="field" style="margin-top:12px"><label>Passwort wiederholen</label><input id="confirmPassword" class="input" type="password" autocomplete="new-password"></div><button class="btn" style="width:100%;margin-top:16px" onclick="saveNewPassword()">Passwort speichern</button><div id="recoveryMsg"></div></div></div>`}
async function saveNewPassword(){const password=$('#newPassword').value,confirm=$('#confirmPassword').value;if(password.length<8){$('#recoveryMsg').innerHTML=notice('Das Passwort muss mindestens 8 Zeichen haben.','error');return}if(password!==confirm){$('#recoveryMsg').innerHTML=notice('Die Passwörter stimmen nicht überein.','error');return}setLoading(true);const {error}=await sb.auth.updateUser({password});setLoading(false);if(error){$('#recoveryMsg').innerHTML=notice(error.message,'error');return}recoveryMode=false;history.replaceState(null,'',location.pathname);await startSession()}
async function logout(){await sb.auth.signOut()}
async function startSession(){setLoading(true);const {data,error}=await sb.rpc('get_workspace_access');if(error||!data){setLoading(false);accessRole=null;renderNoAccess();return}accessRole=data.role;workspaceMembers=[];if(isAdmin()){const members=await sb.rpc('get_workspace_members');if(members.error){setLoading(false);document.getElementById('app').innerHTML=`<div class="login-wrap"><div class="card login-card"><h1>Zugriff konnte nicht geladen werden</h1>${notice(members.error.message,'error')}<button class="btn secondary" onclick="logout()">Abmelden</button></div></div>`;return}workspaceMembers=members.data||[]}setLoading(false);await loadAll()}

function visits(id){return participations.filter(a=>a.person_id===id&&a.attended&&events.some(e=>e.id===a.event_id&&e.status!=='Abgesagt')).length}function status(id){const v=visits(id);return v===0?['Noch kein Besuch','new','○']:v===1?['Erstbesuch','first','🟢']:v===2?['Neu','new','🔵']:['Stammgast','regular','⭐']}function evParts(id){return participations.filter(a=>a.event_id===id)}function evStats(id){const r=evParts(id);return{yes:r.filter(x=>x.response==='yes').length,attended:r.filter(x=>x.attended).length,noShows:r.filter(x=>x.response==='yes'&&!x.attended).length,total:r.length}}function getPerson(id){return people.find(p=>p.id===id)}

function eventConversion(eid){const event=events.find(e=>e.id===eid);if(!event)return{newPeople:0,newCustomers:0,rate:0};const peopleIds=[...new Set(evParts(eid).filter(a=>a.attended).map(a=>a.person_id))],newPeople=peopleIds.filter(pid=>{const first=personHistory(pid).filter(x=>x.a.attended&&x.e.status!=='Abgesagt').sort((a,b)=>a.e.event_date.localeCompare(b.e.event_date))[0];return first?.e.id===eid}),newCustomers=newPeople.filter(pid=>customerStatus(getPerson(pid))==='through_event').length;return{newPeople:newPeople.length,newCustomers,rate:newPeople.length?Math.round(newCustomers/newPeople.length*100):0}}

function dashboard(){const now=new Date(),today=localToday(),past=events.filter(e=>e.event_date<today&&e.status!=='Abgesagt'),next=[...events].filter(e=>e.event_date>=today&&(!e.status||e.status==='Geplant')).sort((a,b)=>a.event_date.localeCompare(b.event_date))[0],last=[...past].sort((a,b)=>b.event_date.localeCompare(a.event_date))[0],lastStats=last?evStats(last.id):{yes:0,attended:0,noShows:0},regulars=people.filter(p=>visits(p.id)>=3).length,customers=people.filter(isCustomer).length,reliability=lastStats.yes?Math.round(lastStats.attended/lastStats.yes*100):0,average=past.length?(participations.filter(a=>a.attended&&past.some(e=>e.id===a.event_id)).length/past.length).toFixed(1).replace('.',','):'0',growthSince=new Date(now.getTime()-30*86400000),newPeople=people.filter(p=>p.created_at&&new Date(p.created_at)>=growthSince).length,topGuests=[...people].filter(p=>visits(p.id)>0).sort((a,b)=>visits(b.id)-visits(a.id)||a.name.localeCompare(b.name)).slice(0,5),trend=[...past].sort((a,b)=>b.event_date.localeCompare(a.event_date)).slice(0,6).reverse(),trendMax=Math.max(1,...trend.map(e=>evStats(e.id).attended)),refs=people.map(p=>({...p,count:people.filter(other=>other.referred_by===p.id).length})).filter(p=>p.count).sort((a,b)=>b.count-a.count);return `<div class="page-head"><div><div class="kicker">Überblick</div><h2>Deine Community</h2><p>Live-Daten aus Supabase.</p></div></div><div class="grid stats">${stat('Personen',people.length,`${newPeople} neu in den letzten 30 Tagen`)}${stat('Events',events.length,'Insgesamt erfasst')}${stat('Kunden',customers,`${regulars} Stammgäste`)}${stat('Ø Teilnehmer',average,'Pro Event')}</div><div class="grid two-col" style="margin-top:16px"><section class="card"><h3 class="section-title">📅 Nächstes Event</h3>${next?`<div class="person-name">${esc(next.title)}</div><div class="meta">${fmt(next.event_date)} · ${evStats(next.id).yes} Zusagen</div>`:'<div class="empty">Noch kein Event geplant.</div>'}</section><section class="card"><h3 c function eventsPage(){const shown=eventFilter==='Alle'?events:events.filter(e=>(e.status||'Geplant')===eventFilter);return `<div class="page-head"><div><div class="kicker">Veranstaltungen</div><h2>Events</h2><p>Zusagen und Teilnehmer verwalten.</p></div><button class="btn" onclick="openEvent()">+ Event</button></div><div class="toolbar"><label for="eventFilter" class="meta">Status</label><select id="eventFilter" class="event-filter" onchange="eventFilter=this.value;render()"><option ${eventFilter==='Alle'?'selected':''}>Alle</option><option ${eventFilter==='Geplant'?'selected':''}>Geplant</option><option ${eventFilter==='Abgeschlossen'?'selected':''}>Abgeschlossen</option><option ${eventFilter==='Abgesagt'?'selected':''}>Abgesagt</option></select><span class="meta">${shown.length} Events</span><button class="btn secondary" onclick="exportEvents()" ${shown.length?'':'disabled'}>CSV herunterladen</button></div><section class="card">${shown.length?shown.map(e=>{const s=evStats(e.id),statusClass=e.status==='Abgeschlossen'?'done':e.status==='Abgesagt'?'canceled':'planned';return `<div class="row event-list-row" onclick="openEventDetail('${e.id}')" style="cursor:pointer"><div><div class="person-name">${esc(e.title)}</div><div class="meta">${fmt(e.event_date)} · <span class="event-status ${statusClass}">${esc(e.status||'Geplant')}</span>${e.location?' · '+esc(e.location):''} · ${s.yes} Zusagen · ${s.attended} Teilnehmer</div></div><span>›</span></div>`}).join(''):'<div class="empty">Keine Events für diesen Status.</div>'}</section>`}

function openRestore(){if(!isAdmin())return;restoreData=null;restoreError='';modal='restore';render()}function openAccess(){if(!isAdmin())return;modal='access';render()}function openPerson(){modal='person';render()}function openEditPerson(id){selectedPersonId=id;modal='editPerson';render()}function openEvent(){eventTemplateId=null;modal='event';render()}function openCopyEvent(id){if(!events.some(e=>e.id===id))return;eventTemplateId=id;modal='event';render()}function openEditEvent(id){selectedEventId=id;modal='editEvent';render()}function openExistingPerson(id){selectedEventId=id;modal='existingPerson';render()}function openGuest(id){modal='guest';selectedEventId=id;render()}function closeModal(){modal=null;eventTemplateId=null;restoreData=null;restoreError='';render()}

function inspectPotentialFile(file){potentialImportRows=null;if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'}),sheet=wb.Sheets[wb.SheetNames.find(n=>n.toLowerCase().includes('300'))||wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''}),header=rows[0]||[],nameIndex=header.findIndex(v=>String(v).trim().toLowerCase()==='name');if(nameIndex<0)throw new Error('In der Datei wurde keine Spalte „Name“ gefunden.');const bool=v=>['true','ja','yes','x','1','wahr'].includes(String(v).trim().toLowerCase()),text=v=>String(v??'').trim();potentialImportRows=rows.slice(1).map(row=>({name:text(row[nameIndex]),sociotope:text(row[2]),big_five:bool(row[3]),everyday_contact:bool(row[4]),focus_profession:bool(row[5]),opinion_leader:bool(row[6]),yellow_multiplier:bool(row[7]),naysayer:bool(row[8]),new_interesting_contact:bool(row[9]),other_focus_contact:bool(row[10])})).filter(r=>r.name);render()}catch(err){alert(err.message||'Die Excel-Datei konnte nicht gelesen werden.')}};reader.readAsArrayBuffer(file)}
async function savePotentialImport(){if(!isAdmin()||!potentialImportRows?.length)return;if(!confirm(`Die bisherige Potential-Liste wird durch ${potentialImportRows.length} Kontakte ersetzt. Fortfahren?`))return;setLoading(true);const removed=await sb.from('potential_contacts').delete().eq('owner_user_id',session.user.id);if(removed.error){setLoading(false);return alert(removed.error.message||'Die bisherige Liste konnte nicht ersetzt werden.')}const rows=potentialImportRows.map(row=>({...row,owner_user_id:session.user.id})),{error}=await sb.from('potential_contacts').insert(rows);setLoading(false);if(error)return alert(error.message||'Import fehlgeschlagen.');potentialImportRows=null;modal=null;await loadAll()}

function adminPage(){const rows=workspaceMembers.map((member,index)=>`<div class="row"><div><div class="person-name member-email">${esc(member.email)}</div><div class="meta">${member.role==='admin'?'Admin · voller Zugriff':`Nur Lesen · ${member.registered?'Konto aktiv':'noch nicht registriert'}`}</div></div>${member.role==='viewer'?`<button class="btn ghost remove-person" onclick="removeViewerAt(${index})">Entfernen</button>`:''}</div>`).join('');return `<div class="page-head"><div><div class="kicker">Nur für dich</div><h2>Verwaltung</h2><p>Konten, Rollen und Zugriffe auf deinen Community Tracker.</p></div></div><section class="card"><div class="grid stats" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:16px"><div><div class="stat-label">Personen</div><div class="stat-value">${people.length}</div></div><div><div class="stat-label">Events</div><div class="stat-value">${events.length}</div></div><div><div class="stat-label">Konten</div><div class="stat-value">${workspaceMembers.length}</div></div></div><p class="meta">Hier verwaltest du die Zugriffe auf deinen Bereich. Nur dein Admin-Konto sieht diese Seite.</p><div class="field" style="margin-top:16px"><label>E-Mail für Nur-Lesen-Zugriff</label><div style="display:flex;gap:8px"><input id="viewerEmail" class="input" type="email" placeholder="kollege@beispiel.de"><button class="btn" onclick="addViewer()">Freigeben</button></div></div><section style="margin-top:18px"><h4 style="margin:0 0 6px">Konten in deinem Bereich</h4>${rows||'<div class="empty">Noch keine Konten freigegeben.</div>'}</section></section>`}
function accessModal(){const rows=workspaceMembers.map((member,index)=>`<div class="row"><div><div class="person-name member-email">${esc(member.email)}</div><div class="meta">${member.role==='admin'?'Admin · voller Zugriff':`Nur Lesen · ${member.registered?'Konto aktiv':'noch nicht registriert'}`}</div></div>${member.role==='viewer'?`<button class="btn ghost remove-person" onclick="removeViewerAt(${index})">Entfernen</button>`:''}</div>`).join('');return modalShell('Admin-Bereich · Zugriff',`<div class="grid stats" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:16px"><div><div class="stat-label">Personen</div><div class="stat-value">${people.length}</div></div><div><div class="stat-label">Events</div><div class="stat-value">${events.length}</div></div><div><div class="stat-label">Konten</div><div class="stat-value">${workspaceMembers.length}</div></div></div><p class="meta">Hier siehst du, wer Zugriff auf deinen Bereich hat und ob das Konto bereits registriert ist. Neue Nutzer können auch einen eigenen getrennten Bereich anlegen.</p><div class="field" style="margin-top:16px"><label>E-Mail für Nur-Lesen-Zugriff</label><div style="display:flex;gap:8px"><input id="viewerEmail" class="input" type="email" placeholder="kollege@beispiel.de"><button class="btn" onclick="addViewer()">Freigeben</button></div></div><section style="margin-top:18px"><h4 style="margin:0 0 6px">Konten in deinem Bereich</h4>${rows||'<div class="empty">Noch keine Konten freigegeben.</div>'}</section>`,null)}
function renderModal(){if(!modal)return'';if(modal==='restore')return restoreModal();if(modal==='access')return accessModal();if(modal==='person')return modalShell('Person hinzufügen',`<div class="field"><label>Name</label><input id="pName" class="input"></div><div class="field" style="margin-top:12px"><label><input id="pCustomer" type="checkbox"> Kunde</label></div><div class="field" style="margin-top:12px"><label>Ursprünglich mitgebracht von</label><select id="pReferrer">${referrerOptions()}</select></div>`,`addPerson()`);if(modal==='editPerson'){const p=getPerson(selectedPersonId);return p?modalShell('Person bearbeiten',`<div class="field"><label>Name</label><input id="pName" class="input" value="${esc(p.name)}"></div><div class="field" style="margin-top:12px"><label><input id="pCustomer" type="checkbox" ${p.customer?'checked':''}> Kunde</label></div><div class="field" style="margin-top:12px"><label>Ursprünglich mitgebracht von</label><select id="pReferrer">${referrerOptions(p.id,p.referred_by)}</select></div>`,'savePerson()'):''}if(modal==='event'){const source=events.find(e=>e.id===eventTemplateId),selected=source?new Set(evParts(source.id).map(a=>a.person_id)):null;return modalShell(source?'Event kopieren':'Event erstellen',eventForm(source?{...source,event_date:'',status:'Geplant'}:{title:'Mario Kart Abend',status:'Geplant'})+eventInviteForm(selected),`addEvent()`)}if(modal==='editEvent'){const e=events.find(x=>x.id===selectedEventId);return e?modalShell('Event bearbeiten',eventForm(e),`saveEvent()`):''}if(modal==='existingPerson'){const available=people.filter(p=>!evParts(selectedEventId).some(a=>a.person_id===p.id));return modalShell('Person zum Event hinzufügen',available.length?`<div class="field"><label>Person</label><select id="existingPerson"><option value="">Bitte auswählen</option>${available.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field" style="margin-top:12px"><label>Antwort</label><select id="existingResponse"><option value="none">Offen</option><option value="yes">Zusage</option><option value="no">Absage</option></select></div><div class="field" style="margin-top:12px"><label><input id="existingAttended" type="checkbox"> Hat teilgenommen</label></div>`:'<div class="empty">Alle erfassten Personen sind bereits bei diesem Event.</div>',available.length?'addExistingPerson()':null)}if(modal==='guest')return modalShell('Neuen Gast hinzufügen',`<div class="field"><label>Name</label><input id="gName" class="input"></div><div class="field" style="margin-top:12px"><label>Ursprünglich mitgebracht von</label><select id="gBy">${referrerOptions()}</select></div><div class="field" style="margin-top:12px"><label><input id="gCustomer" type="checkbox"> Kunde</label></div><div class="field" style="margin-top:12px"><label><input id="gAttended" type="checkbox"> Hat teilgenommen</label></div>`,`addGuest()`)}

async function savePerson(){const name=$('#pName').value.trim(),referred_by=$('#pReferrer').value||null,customer_status=readCustomerStatus();if(!name){alert('Bitte einen Namen eingeben.');return}if(!selectedPersonId)return;if(!['none','before_event','through_event'].includes(customer_status)){alert('Bitte einen gültigen Kundenstatus auswählen.');return}if(referred_by===selectedPersonId||referred_by&&!people.some(p=>p.id===referred_by)){alert('Bitte eine gültige Person als Mitbringer auswählen.');return}setLoading(true);try{const {data,error}=await sb.from('persons').update({name,customer:customer_status!=='none',customer_status,referred_by}).eq('id',selectedPersonId).eq('user_id',session.user.id).select('id');if(error)throw error;if(!data?.length)throw new Error('Person konnte nicht gespeichert werden.');modal=null;await loadAll()}catch(error){alert(error.message||'Speichern fehlgeschlagen.')}finally{setLoading(false)}}

function inspectBackup(file){restoreData=null;restoreError='';if(!file){render();return}if(file.size>10*1024*1024){restoreError='Die Sicherungsdatei ist zu groß (maximal 10 MB).';render();return}const reader=new FileReader();reader.onload=event=>{try{const value=JSON.parse(event.target.result);if(value?.format!=='community-tracker-backup'||value?.version!==1)throw new Error('Diese Datei ist keine gültige Community-Tracker-Sicherung.');if(!Array.isArray(value.persons)||!Array.isArray(value.events)||!Array.isArray(value.participations))throw new Error('Die Sicherung enthält nicht alle benötigten Bereiche.');restoreData={format:value.format,version:value.version,persons:value.persons,events:value.events,participations:value.participations};}catch(error){restoreError=error.message||'Die Sicherungsdatei konnte nicht gelesen werden.'}render()};reader.onerror=()=>{restoreError='Die Sicherungsdatei konnte nicht gelesen werden.';render()};reader.readAsText(file)}
